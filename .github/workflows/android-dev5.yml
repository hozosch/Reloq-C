name: Android dev5 candidate and host checks
on:
  push:
    branches: ['codex/android-130-dev5-*']
permissions:
  contents: read
  actions: read
jobs:
  host:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: dictionary-snapshot
          run-id: 42861433404
          github-token: ${{ github.token }}
          path: data/community
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-35'
      - name: Build the native host core
        run: make -C eci -j2 all PROVIDER_LTO=-flto=2
      - name: Check Android settings and real native language paths
        run: |
          python3 android/test_versioning.py
          python3 android/test_translations.py --library eci/libreloq_eci.so
          python3 android/test_settings.py --java-home "$JAVA_HOME" --android-jar "$ANDROID_HOME/platforms/android-35/android.jar"
          python3 android/test_direct_boot.py --java-home "$JAVA_HOME" --library eci/libreloq_eci.so
          python3 android/test_native_transport.py --java-home "$JAVA_HOME"
          python3 nvda/test_eci_ptbr_numbers.py --library eci/libreloq_eci.so
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: dictionary-snapshot
          run-id: 42861433404
          github-token: ${{ github.token }}
          path: data/community
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install SDK and NDK
        run: sdkmanager 'ndk;30.0.16248370' 'platforms;android-35' 'build-tools;35.0.1'
      - name: Verify resources and compatibility
        run: |
          python3 android/test_versioning.py
          python3 android/test_translations.py
          python3 android/test_direct_boot.py --java-home "$JAVA_HOME"
      - name: Fetch previous Android release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download v1.2.2 --repo "$GITHUB_REPOSITORY" --pattern 'reloq-c-android-arm64-1.2.2.apk' --dir previous
      - name: Build signed test APK
        run: |
          python3 android/build.py --sdk "$ANDROID_HOME" --ndk "$ANDROID_HOME/ndk/30.0.16248370" --java-home "$JAVA_HOME" --verified-dictionaries --previous-package previous/reloq-c-android-arm64-1.2.2.apk --jobs 2 --output dist/reloq-c-android-arm64-1.3.0-dev5.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android-issues-dev5
          path: dist/reloq-c-android-arm64-1.3.0-dev5.apk
          compression-level: 0
          retention-days: 14
