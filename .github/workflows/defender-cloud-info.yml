name: Inspect Defender cloud configuration
on:
  push:
    branches: [codex/defender-cloud-info-20261109]
permissions:
  contents: read
jobs:
  cloud-info:
    runs-on: windows-2022
    timeout-minutes: 5
    steps:
      - name: Read the test machine settings
        shell: pwsh
        run: |
          try {
            Get-MpComputerStatus -ErrorAction Stop | Select-Object AMRunningMode, AntivirusEnabled, RealTimeProtectionEnabled, AntivirusSignatureVersion | Format-List
            Get-MpPreference -ErrorAction Stop | Select-Object MAPSReporting, SubmitSamplesConsent, CloudBlockLevel, DisableBlockAtFirstSeen | Format-List
          } catch { Write-Output "Configuration could not be read: $($_.Exception.Message)"; exit 1 }
