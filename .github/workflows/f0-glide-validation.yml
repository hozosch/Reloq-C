name: Validate F0 NVDA candidate
on:
  push:
    branches: [codex/f0-glide-validation-20261125]
permissions:
  contents: read
  actions: read
jobs:
  native:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: nvda-addon
          run-id: 45650284338
          github-token: ${{ github.token }}
          path: candidate
      - name: Verify real Windows audio and cancellation
        shell: pwsh
        run: |
          $addon = (Get-Item candidate/reloq-c-synth-x64-2.1.1-dev5.nvda-addon).FullName
          python -c "import zipfile; z=zipfile.ZipFile(r'$addon'); assert z.testzip() is None; z.extract('synthDrivers/reloqC/eci.dll', 'candidate')"
          if ($LASTEXITCODE -ne 0) { throw 'Core extraction failed' }
          $dll = (Get-Item candidate/synthDrivers/reloqC/eci.dll).FullName
          python -B nvda/test_eci_pitch_glide.py --library $dll
          if ($LASTEXITCODE -ne 0) { throw 'F0 transition test failed' }
          $env:PYTHONPATH = 'addon;nvda'
          python -B addon/test_synth_native.py --library $dll --addon $addon
          if ($LASTEXITCODE -ne 0) { throw 'NVDA cancellation and native audio integration failed' }
  settings:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: nvda-addon
          run-id: 45650284338
          github-token: ${{ github.token }}
          path: candidate
      - name: Verify accessible settings in real NVDA
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download release-2026.3.1 --repo nvaccess/nvda --pattern nvda_2026.3.1.exe --dir candidate
          if ($LASTEXITCODE -ne 0) { throw 'NVDA download failed' }
          if ((Get-FileHash candidate/nvda_2026.3.1.exe -Algorithm SHA256).Hash -ne '6F80A5B0CA720A7D0D314B5BE212F37388BBE81A1107AC3298C1821A1CD3F052') { throw 'Unexpected NVDA installer' }
          $portable = Join-Path $pwd 'portable-nvda'
          $installer = (Get-Item candidate/nvda_2026.3.1.exe).FullName
          $p = Start-Process $installer -ArgumentList '--create-portable-silent', "--portable-path=$portable" -Wait -PassThru
          if ($p.ExitCode -ne 0 -or !(Test-Path "$portable/nvda.exe")) { throw 'NVDA portable install failed' }
          python -B addon/test_nvda_real_settings.py --nvda portable-nvda/nvda.exe --addon candidate/reloq-c-synth-x64-2.1.1-dev5.nvda-addon --work settings-results
          if ($LASTEXITCODE -ne 0) { throw 'Real NVDA settings probe failed' }
