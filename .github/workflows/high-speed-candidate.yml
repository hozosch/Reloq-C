name: NVDA acoustic timing listening candidate
on:
  push:
    branches: ['codex/eq-131-dev1-*']
permissions:
  contents: read
  actions: read
jobs:
  addon:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: update130-dictionaries
          path: data/community
          run-id: 42911719457
          github-token: ${{ github.token }}
      - name: Install Windows compiler and translation tools
        run: |
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 update -qq
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 install -y --no-install-recommends gcc-mingw-w64-x86-64-posix gettext
      - name: Verify cached language-rule inputs
        run: |
          git diff --exit-code a05d5ac2003ac423eab8ffef8ad2b293e4c600ce HEAD -- \
            vendor/openevv61/ src/reloq_voice_filter.c src/reloq_orthography.c \
            src/reloq_german_word_edges.c src/reloq_english_word_edges.c include/ \
            ':(exclude)include/reloq_core.h' ':(exclude)include/reloq_eci.h' \
            ':(exclude)include/reloq_equalizer.h'
      - uses: actions/cache@v4
        id: rules
        with:
          path: vendor/openevv61/build
          key: sapi-rules-ubuntu24-gcc13-v1-x64-01b350b6ebd77d6e3353892a975d30272c04af54048edcadb04bb8c822ec5549
      - name: Restore cache timestamps
        if: steps.rules.outputs.cache-hit == 'true'
        run: |
          find vendor/openevv61/build -type f -exec touch {} +
      - name: Check all normal and boosted speed values
        run: |
          gcc -O2 -std=c11 -Wall -Wextra -Werror -Iinclude tests/test_reloq_voice_controls.c src/reloq_voice_controls.c -lm -o /tmp/test_reloq_voice_controls
          /tmp/test_reloq_voice_controls
      - name: Check extended-rate tract transition timing
        run: |
          gcc -O2 -std=c11 -Wall -Wextra -Werror -ffp-contract=off -ffunction-sections -fdata-sections -Iinclude tests/test_reloq_tract_transition.c src/reloq_core.c src/reloq_rate_transfer.c src/reloq_noise_profile.c -Wl,--gc-sections -lm -o /tmp/test_reloq_tract_transition
          /tmp/test_reloq_tract_transition
      - name: Build the current speech core and NVDA add-on
        run: |
          make -C eci -j2 windows-x64 PROVIDER_LTO=-flto=2 WINDOWS_CC=x86_64-w64-mingw32-gcc-posix WINDOWS_OBJDUMP=x86_64-w64-mingw32-objdump
          python3 - <<'PY'
          import pathlib,sys
          sys.path.insert(0,'addon')
          from build_synth import build,DEFAULT_OUTPUT
          build(DEFAULT_OUTPUT,pathlib.Path('eci/eci.dll'),refresh_dictionaries=False)
          PY
          for lang in en de; do PYTHONPATH=addon:nvda python3 -B -c 'import pathlib,sys,test_synth; sys.argv=["test_synth.py",sys.argv[1]]; test_synth.main(package_path=pathlib.Path("dist/reloq-c-synth-x64-1.3.1-dev5.nvda-addon"))' "$lang"; done
          PYTHONPATH=nvda python3 -B nvda/test_updates.py
      - uses: actions/upload-artifact@v4
        with:
          name: high-speed-addon-candidate
          path: dist/reloq-c-synth-x64-1.3.1-dev5.nvda-addon
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
  windows:
    needs: addon
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: high-speed-addon-candidate
          path: candidate
      - name: Check the packaged core, WPM and original timing
        shell: pwsh
        run: |
          $addon = (Get-Item candidate/reloq-c-synth-x64-1.3.1-dev5.nvda-addon).FullName
          python -c "import zipfile; z=zipfile.ZipFile(r'$addon'); assert z.testzip() is None; z.extract('synthDrivers/reloqC/eci.dll', 'candidate')"
          if ($LASTEXITCODE -ne 0) { throw 'Core extraction failed' }
          $dll = (Get-Item candidate/synthDrivers/reloqC/eci.dll).FullName
          foreach ($test in @('nvda/test_eci_high_speed_reference.py','nvda/test_eci_slow_speed_reference.py','nvda/test_eci_transition_reference.py','nvda/test_eci_cjk_acoustic_clock.py','nvda/test_eci_speed_setting.py','nvda/test_eci_inline_queue.py','nvda/test_eci_pitch_hz.py','nvda/test_eci_ptbr_numbers.py','nvda/test_eci_equalizer.py','nvda/test_eci_wpm.py','nvda/test_eci_wpm_languages.py','nvda/test_eci_wpm_setting.py')) {
            python -B $test --library $dll
            if ($LASTEXITCODE -ne 0) { throw "$test failed" }
          }
          $env:PYTHONPATH='addon;nvda'
          python -B addon/test_synth_native.py --library $dll --addon $addon
          if ($LASTEXITCODE -ne 0) { throw 'Native NVDA driver test failed' }
      - name: Verify live settings in NVDA
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download release-2026.3.1 --repo nvaccess/nvda --pattern nvda_2026.3.1.exe --dir candidate
          if ($LASTEXITCODE -ne 0) { throw 'NVDA download failed' }
          if ((Get-FileHash candidate/nvda_2026.3.1.exe -Algorithm SHA256).Hash -ne '6F80A5B0CA720A7D0D314B5BE212F37388BBE81A1107AC3298C1821A1CD3F052') { throw 'Unexpected NVDA installer' }
          $portable = Join-Path $pwd 'portable-nvda'
          $installer = (Get-Item candidate/nvda_2026.3.1.exe).FullName
          $p = Start-Process $installer -ArgumentList '--create-portable-silent', "--portable-path=$portable" -Wait -PassThru
          if ($p.ExitCode -ne 0 -or !(Test-Path "$portable/nvda.exe")) { throw 'NVDA portable install failed' }
          python -B addon/test_nvda_real_settings.py --nvda portable-nvda/nvda.exe --addon candidate/reloq-c-synth-x64-1.3.1-dev5.nvda-addon --work settings-results
          if ($LASTEXITCODE -ne 0) { throw 'Real NVDA settings probe failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: high-speed-nvda-test
          path: candidate/reloq-c-synth-x64-1.3.1-dev5.nvda-addon
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
