name: Compare original and ReLoq high-speed timing
on:
  push:
    branches: ['codex/high-speed-*']
permissions:
  contents: read
  actions: read
jobs:
  compare:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: x86
      - name: Download the verified 1.3.0 native x86 build
        uses: actions/download-artifact@v4
        with:
          name: update130-native-x86
          path: candidate
          run-id: 42911719457
          github-token: ${{ github.token }}
      - name: Prepare the released speech core and pinned original reference
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, pathlib, urllib.request, zipfile
          root=pathlib.Path('reference');root.mkdir()
          archive=pathlib.Path('reference-addon.zip')
          urllib.request.urlretrieve('https://github.com/fastfinge/eloquence_64/releases/download/v25/Eloquence-v25.nvda-addon',archive)
          assert hashlib.sha256(archive.read_bytes()).hexdigest()=='3b14eaa9923a006553b7ea6152abf2ca9cd8f11c1b3dcebe2a905658863ea409'
          with zipfile.ZipFile(archive) as z:
              for name in z.namelist():
                  if name.lower().startswith('synthdrivers/eloquence/') and name.lower().endswith(('.dll','.syn','.ini')):
                      (root/pathlib.PurePosixPath(name).name).write_bytes(z.read(name))
          ini=root/'ECI.INI';text=ini.read_text(encoding='latin1').replace('C:\\dummy\\',str(root.resolve())+'\\')
          assert 'C:\\dummy\\' not in text
          ini.write_text(text,encoding='ascii')
          payload,=pathlib.Path('candidate').glob('*.zip')
          with zipfile.ZipFile(payload) as z:
              assert z.testzip() is None
              (pathlib.Path('candidate')/'eci.dll').write_bytes(z.read('eci.dll'))
          PY
      - name: Measure the reference and released engine at matched native and NVDA speeds
        run: |
          python tools/observe_high_speed_reference.py --library reference/ECI.DLL --engine original --output observations/original
          if ($LASTEXITCODE -ne 0) { throw 'Original comparison failed' }
          python tools/observe_high_speed_reference.py --library candidate/eci.dll --engine reloq --output observations/reloq
          if ($LASTEXITCODE -ne 0) { throw 'ReLoq comparison failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: high-speed-comparison
          path: observations/
          if-no-files-found: error
          retention-days: 7
