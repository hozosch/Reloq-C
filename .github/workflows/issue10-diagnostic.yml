name: Issue 10 Windows cancellation diagnostic
on:
  push:
    branches: [codex/release110]
    paths: [addon/test_synth_native.py, .github/workflows/issue10-diagnostic.yml]
permissions:
  contents: read
  actions: read
jobs:
  reproduce:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: nvda-candidate-unvalidated
          path: candidate
          run-id: 41838143257
          github-token: ${{ github.token }}
      - name: Capture the original cancellation failure
        shell: pwsh
        run: |
          $core = (Get-ChildItem candidate -Recurse -Filter eci.dll | Select-Object -First 1).FullName
          $addon = (Get-ChildItem candidate -Recurse -Filter *.nvda-addon | Select-Object -First 1).FullName
          for ($i = 0; $i -lt 12; $i++) {
            Write-Output "Filename stress attempt $i"
            python addon/test_synth_native.py --library $core --addon $addon --output issue10.json
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
