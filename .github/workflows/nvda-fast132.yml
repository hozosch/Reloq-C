name: Build NVDA 1.3.2 test
on:
  push:
    branches: [codex/nvda-fast132]
permissions:
  contents: read
  actions: read
jobs:
  nvda-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      RELOQ_BUILD_EPOCH: '1700000000'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: wordseg-core-candidate
          run-id: 43025732720
          github-token: ${{ github.token }}
          path: native
      - name: Check unchanged native inputs and install translation tools
        run: |
          git fetch --no-tags --depth=1 origin d4c98b7a9074c62f6f4d9e09d78eb620202d0779
          git diff --quiet FETCH_HEAD HEAD -- eci src include vendor
          sudo apt-get -o Acquire::Retries=2 update -qq
          sudo apt-get -o Acquire::Retries=2 install -y --no-install-recommends gettext
      - name: Build and test the NVDA add-on
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os, sys
          p = Path('addon/synth/manifest.ini')
          manifest = p.read_text(encoding='utf8')
          assert 'version = "1.3.2"' in manifest
          p.write_text(manifest.replace('version = "1.3.2"', 'version = "1.3.2-dev2"'), encoding='utf8')
          os.environ['GITHUB_SHA'] = '041d9663a2d7536541ce844d0b77ccdc0cb29fc9'
          sys.path.insert(0, 'addon')
          from build_synth import build
          build(Path('dist/reloq-c-synth-x64-1.3.2-dev2.nvda-addon'), Path('native/eci/eci.dll'), refresh_dictionaries=False)
          PY
          PYTHONPATH=addon:nvda python3 -B -c 'import pathlib,test_synth; test_synth.main(package_path=pathlib.Path("dist/reloq-c-synth-x64-1.3.2-dev2.nvda-addon"))'
      - uses: actions/upload-artifact@v4
        with:
          name: nvda-test-132
          path: dist/reloq-c-synth-x64-1.3.2-dev2.nvda-addon
          compression-level: 0
          retention-days: 7
