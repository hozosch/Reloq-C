name: Build installable release packages
on:
  push:
    branches: ['codex/release*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      stable: ${{ steps.version.outputs.stable }}
      packageable: ${{ steps.version.outputs.packageable }}
      build_epoch: ${{ steps.version.outputs.build_epoch }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Select stable installable packaging
        id: version
        run: |
          python3 - <<'PY'
          import os, re, time
          from pathlib import Path
          text = Path('addon/synth/manifest.ini').read_text()
          value = re.search(r'^version\s*=\s*"([^"]+)"', text, re.M)[1]
          stable = bool(re.fullmatch(r'\d+\.\d+\.\d+', value))
          packageable = stable or bool(re.fullmatch(r'\d+\.\d+\.\d+-(?:dev|rc)\d+', value))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('stable=' + str(stable).lower() + '\n')
              output.write('packageable=' + str(packageable).lower() + '\n')
              output.write(f'build_epoch={int(time.time())}\n')
          if not stable:
              print('Test packages will be built without a publishable release manifest.')
          PY
  dictionaries:
    needs: version
    if: needs.version.outputs.packageable == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Download and verify current community dictionaries
        env:
          RELOQ_BUILD_GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 -c "import sys; sys.path.insert(0, 'addon'); from build_synth import refresh_community_dictionaries; refresh_community_dictionaries()"
      - uses: actions/upload-artifact@v4
        with:
          name: dictionary-snapshot
          path: data/community/
          if-no-files-found: error
          retention-days: 30
  native-regressions:
    needs: dictionaries
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check dictionary snapshot management
        run: python3 -B nvda/test_dictionary_manager.py
      - uses: actions/download-artifact@v4
        with:
          name: dictionary-snapshot
          path: data/community
      - name: Build the shared native engine and acoustic rule tests
        run: |
          python3 tools/generate_wordseg_data.py
          git diff --exit-code -- src/reloq_wordseg_data.inc
          make -C eci -j2 libreloq_eci.so test_reloq_native_rules test_reloq_wpm_native test_wpm_arithmetic test_eci_stream_time test_reloq_text_peaks test_reloq_presence test_reloq_hearing_profiles PROVIDER_LTO=-flto=2
      - name: Check number, pitch, pause, source-index and multilingual behavior
        run: |
          ./eci/test_reloq_native_rules
          ./eci/test_reloq_wpm_native
          ./eci/test_wpm_arithmetic
          ./eci/test_eci_stream_time
          ./eci/test_reloq_text_peaks
          ./eci/test_reloq_presence
          ./eci/test_reloq_hearing_profiles
          python3 -B tests/test_replace_release.py
          python3 -B tests/test_release_dictionaries.py
          python3 -B tools/test_native_text_input.py
          python3 -B nvda/test_eci_dictionary_cache.py --library eci/libreloq_eci.so
          python3 -B nvda/test_eci_dictionary_retention.py --library eci/libreloq_eci.so
          python3 -B nvda/test_eci_dash_pause.py --library eci/libreloq_eci.so
          python3 -B nvda/test_eci_release113.py --library eci/libreloq_eci.so
          python3 -B nvda/test_eci_release114.py --library eci/libreloq_eci.so
          python3 -B nvda/test_eci_sentence_punctuation.py --library eci/libreloq_eci.so
          python3 -B nvda/test_eci_acoustic_clock_option.py --library eci/libreloq_eci.so
          python3 -B nvda/test_eci_release120.py --library eci/libreloq_eci.so
          python3 -B nvda/test_eci_mellow_mode.py --library eci/libreloq_eci.so
          python3 -B nvda/test_eci_pitch_hz.py --library eci/libreloq_eci.so
          python3 -B nvda/test_eci_wpm.py --library eci/libreloq_eci.so
          python3 -B nvda/test_eci_wpm_setting.py --library eci/libreloq_eci.so
          python3 -B nvda/test_eci_wpm_languages.py --library eci/libreloq_eci.so
          python3 -B nvda/test_eci_ptbr_numbers.py --library eci/libreloq_eci.so
          python3 -B nvda/test_eci_equalizer.py --library eci/libreloq_eci.so
          gcc -O2 -std=c11 -Wall -Wextra -Werror -Iinclude tests/test_reloq_equalizer.c src/reloq_equalizer.c -lm -o /tmp/test_reloq_equalizer
          /tmp/test_reloq_equalizer
          python3 -B nvda/test_eci_inflection_tags.py --library eci/libreloq_eci.so
          python3 -B nvda/test_eci_inline_queue.py --library eci/libreloq_eci.so
          python3 -B nvda/test_eci_hz_adapter.py
          python3 -B nvda/test_eci_callback_only.py --library eci/libreloq_eci.so
          python3 -B nvda/test_eci_german_final_a_pause.py --library eci/libreloq_eci.so
          python3 -B addon/test_hertz_settings_panel.py
          python3 -B addon/test_speech_tags.py
          python3 -B addon/test_wordseg.py
          python3 -B addon/test_nvda_dictionary_import.py
          python3 -B addon/test_segmentation_eci.py --library eci/libreloq_eci.so
          python3 -B addon/test_uppercase_native.py --library eci/libreloq_eci.so
          python3 -B nvda/test_eci_wordseg_native.py --library eci/libreloq_eci.so
          python3 -B nvda/test_eci_german_cup_native.py --library eci/libreloq_eci.so
          python3 -B nvda/test_updates.py
          python3 -B nvda/test_eci_dictionary_startup.py --library eci/libreloq_eci.so
          python3 -B nvda/test_eci_greek_connected.py --library eci/libreloq_eci.so
          python3 -B nvda/test_eci_greek_characters.py --library eci/libreloq_eci.so
          python3 -B nvda/test_eci_chinese_locale_order.py --library eci/libreloq_eci.so
          python3 -B nvda/test_eci_chinese_mixed_112.py
          python3 -B nvda/test_eci_cjk_latin_native.py
          python3 -B nvda/test_eci_asian_greek_native.py
      - name: Verify SAPI delivery, timing and cancellation against the engine
        run: make -C sapi test
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify Android controls against the shared native engine
        run: python3 android/test_native_transport.py --java-home "$JAVA_HOME" --library eci/libreloq_eci.so
  sapi:
    needs: [version, dictionaries]
    uses: ./.github/workflows/sapi-installer.yml
    with:
      shared_dictionary_snapshot: true
      build_epoch: ${{ needs.version.outputs.build_epoch }}
  android:
    needs: [version, dictionaries]
    runs-on: ubuntu-24.04
    env:
      RELOQ_BUILD_EPOCH: ${{ needs.version.outputs.build_epoch }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: dictionary-snapshot
          path: data/community
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Check official-release update selection
        run: |
          python3 android/test_versioning.py
          javac -d /tmp/reloq-update-test android/java/org/reloq/tts/UpdateData.java android/test/UpdateDataTest.java
          java -cp /tmp/reloq-update-test org.reloq.tts.UpdateDataTest
          python3 android/test_auto_updates.py --java-home "$JAVA_HOME"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install official SDK and NDK tools
        run: sdkmanager 'ndk;30.0.16248370' 'platforms;android-35' 'build-tools;35.0.1'
      - name: Check Android settings, translations and dictionary startup
        run: |
          python3 android/test_translations.py
          python3 android/test_settings.py --settings-only --java-home "$JAVA_HOME" --android-jar "$ANDROID_HOME/platforms/android-35/android.jar"
          python3 android/test_direct_boot.py --java-home "$JAVA_HOME"
          python3 android/test_update_compilation.py --java-home "$JAVA_HOME" --android-jar "$ANDROID_HOME/platforms/android-35/android.jar"
      - name: Download the preceding APK for upgrade verification
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download --repo "$GITHUB_REPOSITORY" --pattern 'reloq-c-android-arm64-*.apk' --dir previous
      - name: Build and verify ARM64 APK
        run: |
          previous_apk=(previous/*.apk)
          test "${#previous_apk[@]}" -eq 1
          python3 android/build.py --sdk "$ANDROID_HOME" --ndk "$ANDROID_HOME/ndk/30.0.16248370" --java-home "$JAVA_HOME" --verified-dictionaries --replace-from "${previous_apk[0]}" --jobs 2
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: dist/reloq-c-android-arm64-*.apk
          compression-level: 0
          retention-days: 14
  nvda:
    needs: [version, sapi]
    runs-on: ubuntu-24.04
    env:
      RELOQ_BUILD_EPOCH: ${{ needs.version.outputs.build_epoch }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: dictionary-snapshot
          path: data/community
      - uses: actions/download-artifact@v4
        with:
          name: sapi-native-x64
          path: dist
      - name: Install translation compiler
        timeout-minutes: 6
        run: |
          if command -v msgfmt >/dev/null; then exit 0; fi
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update -qq
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y --no-install-recommends gettext
      - name: Package the same verified x64 core for NVDA
        run: |
          python3 - <<'PY'
          import pathlib, sys, zipfile
          sys.path.insert(0, 'addon')
          from build_synth import build, DEFAULT_OUTPUT
          payload, = pathlib.Path('dist').glob('reloq-c-sapi5-x64-*-payload.zip')
          with zipfile.ZipFile(payload) as archive:
              assert archive.testzip() is None
              core = pathlib.Path('eci/eci.dll')
              core.write_bytes(archive.read('eci.dll'))
          build(DEFAULT_OUTPUT, core, refresh_dictionaries=False)
          PY
      - name: Verify update identity against the published add-on
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v1.2.1 --repo "$GITHUB_REPOSITORY" --pattern 'reloq-c-synth-x64-1.2.1.nvda-addon' --dir previous-addon
          python3 tools/test_nvda_upgrade.py --previous previous-addon/reloq-c-synth-x64-1.2.1.nvda-addon --candidate dist/reloq-c-synth-x64-1.3.2.nvda-addon
      - name: Verify NVDA driver and offline dictionary startup
        run: |
          for language in en de; do
            PYTHONPATH=addon:nvda python3 -B -c 'import pathlib,sys,test_synth; sys.argv=["test_synth.py",sys.argv[1]]; test_synth.main(package_path=pathlib.Path("dist/reloq-c-synth-x64-1.3.2.nvda-addon"))' "$language"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: nvda-addon
          path: dist/*.nvda-addon
          compression-level: 0
          retention-days: 14
  nvda-windows:
    needs: nvda
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: nvda-addon
          path: candidate
      - name: Verify packaged Windows core and NVDA integration
        shell: pwsh
        run: |
          $addon = (Get-Item candidate/reloq-c-synth-x64-1.3.2.nvda-addon).FullName
          python -c "import zipfile; z=zipfile.ZipFile(r'$addon'); assert z.testzip() is None; z.extract('synthDrivers/reloqC/eci.dll', 'candidate')"
          if ($LASTEXITCODE -ne 0) { throw 'Core extraction failed' }
          $dll = (Get-Item candidate/synthDrivers/reloqC/eci.dll).FullName
          foreach ($test in @('nvda/test_eci_ptbr_numbers.py','nvda/test_eci_equalizer.py','nvda/test_eci_inflection_tags.py','nvda/test_eci_wpm_setting.py')) {
            python -B $test --library $dll
            if ($LASTEXITCODE -ne 0) { throw "$test failed" }
          }
          $env:PYTHONPATH = 'addon;nvda'
          python -B addon/test_nvda_remote_loopback.py --library $dll --addon $addon
          if ($LASTEXITCODE -ne 0) { throw 'NVDA Remote integration failed' }
          python -B addon/test_synth_native.py --library $dll --addon $addon
          if ($LASTEXITCODE -ne 0) { throw 'NVDA/native integration failed' }
      - name: Verify live settings in real NVDA
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download release-2026.3.1 --repo nvaccess/nvda --pattern nvda_2026.3.1.exe --dir candidate
          if ($LASTEXITCODE -ne 0) { throw 'NVDA download failed' }
          if ((Get-FileHash candidate/nvda_2026.3.1.exe -Algorithm SHA256).Hash -ne '6F80A5B0CA720A7D0D314B5BE212F37388BBE81A1107AC3298C1821A1CD3F052') { throw 'Unexpected NVDA installer' }
          $portable = Join-Path $pwd 'portable-nvda'
          $installer = (Get-Item candidate/nvda_2026.3.1.exe).FullName
          $p = Start-Process $installer -ArgumentList '--create-portable-silent', "--portable-path=$portable" -Wait -PassThru
          if ($p.ExitCode -ne 0 -or !(Test-Path "$portable/nvda.exe")) { throw 'NVDA portable install failed' }
          python -B addon/test_nvda_real_settings.py --nvda portable-nvda/nvda.exe --addon candidate/reloq-c-synth-x64-1.3.2.nvda-addon --work settings-results
          if ($LASTEXITCODE -ne 0) { throw 'Real NVDA settings probe failed' }
  collect:
    needs: [version, native-regressions, sapi, android, nvda, nvda-windows]
    if: needs.version.outputs.stable == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: dictionary-snapshot
          path: data/community
      - uses: actions/download-artifact@v4
        with:
          pattern: sapi-native-*
          path: artifacts/payload
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: sapi-installer
          path: artifacts/sapi
      - uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: artifacts/android
      - uses: actions/download-artifact@v4
        with:
          name: nvda-addon
          path: artifacts/nvda
      - name: Collect exactly the three installable packages
        run: python3 tools/release_packages.py collect artifacts release-packages
      - uses: actions/upload-artifact@v4
        with:
          name: release-packages
          path: release-packages/
          compression-level: 0
          retention-days: 30
