name: Build NVDA Hertz test package
on:
  push:
    branches: ['codex/release121hztest']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Windows cross compiler and translations
        run: |
          set -euo pipefail
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|http://archive.ubuntu.com/ubuntu|g' /etc/apt/apt-mirrors.txt
          fi
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update -qq
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y --no-install-recommends gcc-mingw-w64-x86-64-posix gettext
      - name: Build and verify the x64 ECI core
        run: |
          make -C eci -j2 windows-x64 PROVIDER_LTO=-flto=2 WINDOWS_CC=x86_64-w64-mingw32-gcc-posix WINDOWS_OBJDUMP=x86_64-w64-mingw32-objdump
      - name: Package the NVDA test version
        run: |
          python3 - <<'PY'
          import pathlib, sys
          sys.path.insert(0, 'addon')
          from build_synth import build
          package=pathlib.Path('dist/reloq-c-synth-x64-1.2.2-dev1.nvda-addon')
          build(package, pathlib.Path('eci/eci.dll'), refresh_dictionaries=False)
          PY
      - name: Check NVDA driver and tag transport
        run: |
          python3 -B addon/test_speech_tags.py
          for language in en de; do
            PYTHONPATH=addon:nvda python3 -B -c 'import pathlib,sys,test_synth; sys.argv=["test_synth.py",sys.argv[1]]; test_synth.main(package_path=pathlib.Path("dist/reloq-c-synth-x64-1.2.2-dev1.nvda-addon"))' "$language"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: nvda-hz-test
          path: dist/reloq-c-synth-x64-1.2.2-dev1.nvda-addon
          compression-level: 0
          retention-days: 7
  windows_validation:
    needs: build
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: nvda-hz-test
          path: dist
      - name: Extract DLL from the exact add-on
        shell: pwsh
        run: |
          python -c "import pathlib,zipfile; z=zipfile.ZipFile('dist/reloq-c-synth-x64-1.2.2-dev1.nvda-addon'); p=pathlib.Path('dist/eci.dll'); p.write_bytes(z.read('synthDrivers/reloqC/eci.dll'))"
      - name: Check actual Windows ECI output and pitch handling
        shell: pwsh
        run: |
          python -B nvda/test_eci_pitch_hz.py --library dist/eci.dll
          if ($LASTEXITCODE -ne 0) { throw 'Hertz acoustic regression failed' }
          python -B nvda/test_eci_extended_standard_api.py --library dist/eci.dll
          if ($LASTEXITCODE -ne 0) { throw 'ECI voice parameter regression failed' }
          python -B nvda/test_eci_inline_queue.py --library dist/eci.dll
          if ($LASTEXITCODE -ne 0) { throw 'ECI queued control regression failed' }
