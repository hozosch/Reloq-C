name: Persian shared core on Android
on:
  workflow_dispatch:
  push:
    branches: [codex/persian-nvda-prep-20261115, codex/persian-clarity-20261116, codex/persian-issue49-followup-20261117, codex/persian-adjectives-20261117, codex/persian-phones-20261119, codex/persian-native-20261120, codex/persian-issue49-solh-20261120, codex/persian-native-transitions-20261120, codex/persian-sentence-core-20261120, codex/persian-sentence-linear-20261120, codex/persian-context-native-20261120, codex/persian-transition-streaming-20261120, codex/persian-native-sv-probe-20261120, codex/persian-finnish-nasal-swedish-20261120, codex/persian-native-u-20261121]
    paths:
      - .github/workflows/persian-android-core.yml
      - eci/Makefile
      - include/**
      - src/**
      - vendor/openevv61/**
      - tools/prepare_persian_provider.py
      - experiments/aragonese/build_native_probe.py
      - experiments/persian/build_native_probe.py
      - experiments/persian/test_persian_owned_plan.py
      - experiments/persian/compile_fa_city_stems.py
      - reference-persian-cities/**
      - experiments/persian/direct_fa_*.c
      - experiments/persian/direct_fa_*.h
      - experiments/persian/direct_fa_*.inc
      - tests/test_low_arena_concurrent.c
      - tests/test_win32_task_start.c
      - tests/test_provider_licence_start.c
      - tests/win32_task_mock/**
permissions:
  contents: read
concurrency:
  group: persian-android-core-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install the native Android toolchain
        run: sdkmanager 'ndk;30.0.16248370'
      - name: Check the independent Persian language planner
        run: |
          python3 -B experiments/persian/compile_fa_city_stems.py --check
          python3 -B experiments/persian/test_persian_owned_plan.py
      - name: Check overlapping phone clocks
        run: |
          cc -std=c11 -Wall -Wextra -Werror -Iinclude tests/test_reloq_trace_clock.c -o /tmp/reloq-trace-clock
          /tmp/reloq-trace-clock
      - name: Check shared Persian transition planning
        run: |
          python3 -B experiments/persian/test_native_unvoiced_plan.py
          python3 -B experiments/persian/test_native_remaining_voiced.py
      - name: Check simultaneous low-address allocations
        run: |
          make -C eci test_low_arena_concurrent
          ./eci/test_low_arena_concurrent
      - name: Check Windows task-start ordering
        run: |
          make -C eci test_win32_task_start
          ASAN_OPTIONS=detect_leaks=0 ./eci/test_win32_task_start
      - name: Check concurrent provider initialization
        run: |
          make -C eci test_provider_licence_start
          ./eci/test_provider_licence_start
      - uses: actions/cache@v4
        id: provider
        with:
          path: vendor/openevv61/build/android-arm64
          key: persian-android-provider-ndk30-v1-${{ hashFiles('vendor/openevv61/**', 'include/**', 'src/reloq_voice_filter.c', 'src/reloq_orthography.c', 'src/reloq_german_word_edges.c', 'src/reloq_english_word_edges.c', 'src/reloq_persian_acoustics.c', 'src/reloq_persian_acoustics.h', 'tools/prepare_persian_provider.py', 'experiments/persian/build_native_probe.py', 'experiments/aragonese/build_native_probe.py') }}
      - name: Restore cached provider timestamps
        if: steps.provider.outputs.cache-hit == 'true'
        run: find vendor/openevv61/build/android-arm64 -type f -exec touch {} +
      - name: Compile the shared arm64 C engine
        shell: bash
        run: |
          toolchain="$ANDROID_HOME/ndk/30.0.16248370/toolchains/llvm/prebuilt/linux-x86_64/bin"
          make -C eci -j2 libreloq_android.so \
            ANDROID_CC="$toolchain/aarch64-linux-android26-clang" \
            ANDROID_AR="$toolchain/llvm-ar"
          "$toolchain/llvm-nm" -D eci/libreloq_android.so > android-symbols.txt
          grep -q 'eciPersianAcousticScope' android-symbols.txt
          grep -q 'eciPersianProjectUtf8' android-symbols.txt
          grep -q 'eciPersianProjectTextUtf8' android-symbols.txt
          grep -q 'eciPersianProjectTextCompleteUtf8' android-symbols.txt
          grep -q 'eciPersianProjectRunsCompleteUtf8' android-symbols.txt
          grep -q 'eciPersianCharacter' android-symbols.txt
          grep -q 'eciPersianCharacterResolve' android-symbols.txt
          grep -q 'eciPersianSpeakUsNativeRunsUtf8' android-symbols.txt
          grep -q 'eciPersianNumberEvents' android-symbols.txt
          grep -q 'eciPersianPhoneInventory' android-symbols.txt
          grep -q 'eciPersianPhonesFromLegacy' android-symbols.txt
          grep -q 'eciPersianPhonesToLegacy' android-symbols.txt
          grep -q 'eciPersianWordPhonesUtf8' android-symbols.txt
          grep -q 'eciPersianInputToLegacy' android-symbols.txt
          grep -q 'eciPersianPinglishProjectUtf8' android-symbols.txt
          grep -q 'eciPersianApplyGlides' android-symbols.txt
          grep -q 'eciPersianTransferKoreanPitch' android-symbols.txt
          grep -q 'eciPersianTransferKoreanAligned' android-symbols.txt
          grep -q 'eciPersianDonorSpan' android-symbols.txt
          grep -q 'eciPersianCapturePcm' android-symbols.txt
          grep -q 'eciPersianPlanUnvoicedOnsets' android-symbols.txt
          grep -q 'eciPersianBridgeRemaining' android-symbols.txt
