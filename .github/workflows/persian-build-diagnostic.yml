name: Persian CI diagnostic
on:
  push:
    branches: [codex/persian-log-diagnostic-20261116]
permissions:
  actions: read
  contents: read
jobs:
  diagnostics:
    runs-on: ubuntu-latest
    steps:
      - name: Show the failed build tail
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run view 43884470169 --repo hozosch/Reloq-C --log-failed | tail -n 100
