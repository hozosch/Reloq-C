name: Persian eSpeak timing observation
on:
  push:
    branches: [codex/persian-timing-probe-20261114]
    paths: [.github/workflows/persian-espeak-timing.yml]
permissions:
  contents: read
jobs:
  espeak:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install eSpeak NG
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends espeak-ng libespeak-ng1
          espeak-ng --version
      - name: Observe events
        run: |
          python3 experiments/persian/trace_espeak_events.py
          for text in 'دنیا' 'سلام دنیا.' 'ایران'; do
            printf '%s: ' "$text"
            espeak-ng -v fa -x -q "$text"
          done
