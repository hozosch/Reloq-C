      - name: Check Unicode spelling through NVDA's speech pipeline
        shell: bash
        run: |
          export PATH="/c/mingw64/bin:/c/msys64/usr/bin:$PATH"
          export RELOQ_TEST_DLL="$(find candidate -name eci.dll -print -quit)"
          export RELOQ_TEST_ADDON="$RUNNER_TEMP/reloq-unicode-test.nvda-addon"
          python -B -c 'import os,sys; from pathlib import Path; sys.path.insert(0,"addon"); from build_synth import build; build(Path(os.environ["RELOQ_TEST_ADDON"]),Path(os.environ["RELOQ_TEST_DLL"]),refresh_dictionaries=False)'
          python -B addon/test_synth_native.py --library "$RELOQ_TEST_DLL" --addon "$RELOQ_TEST_ADDON" --spelling-only
          for ui_locale in de fa es fr it fi el ja ko pt_BR zh_CN zh_TW an; do
            RELOQ_UI_LOCALE="$ui_locale" python -B -c 'import os,sys; from pathlib import Path; sys.path.insert(0,"addon"); import test_synth; sys.argv=["test_synth.py",os.environ["RELOQ_UI_LOCALE"]]; test_synth.main(package_path=Path(os.environ["RELOQ_TEST_ADDON"]))'
            python -B addon/test_hertz_settings_panel.py "$ui_locale"
          done
          persian_addon=$(find dist -maxdepth 1 -name 'reloq-c-persian-pinglish-*.nvda-addon' -print -quit)
          test -n "$persian_addon"
          python -B experiments/persian/test_nvda_unicode_spelling.py --library "$RELOQ_TEST_DLL" --addon "$persian_addon"
      - name: Test in real NVDA
        shell: pwsh
        env:
          PYTHONIOENCODING: utf-8
        run: |
          $addon = (Get-ChildItem dist -Filter 'reloq-c-persian-pinglish-*.nvda-addon' | Select-Object -First 1).FullName
          $lab = (Get-ChildItem dist -Filter 'reloq-c-lautlabor-*.nvda-addon' | Select-Object -First 1).FullName
          $dll = (Get-ChildItem candidate -Recurse -Filter eci.dll | Select-Object -First 1).FullName
          python -B experiments/persian/test_soundlab_nvda.py --dll "$dll" --espeak portable-nvda/synthDrivers/espeak.dll --data portable-nvda/synthDrivers
          if ($LASTEXITCODE -ne 0) { throw 'Sound laboratory frame and language test failed' }
          python -B experiments/persian/test_phoneme_editor.py --dll "$dll"
          if ($LASTEXITCODE -ne 0) { throw 'Native phoneme editor and resonance filters failed' }
          python -B experiments/persian/test_espeak_spectrum_import.py --dll "$dll"
          if ($LASTEXITCODE -ne 0) { throw 'eSpeak spectral import failed' }
          python -B addon/test_nvda_real_segmentation.py --nvda portable-nvda/nvda.exe --addon "$addon" --plugin experiments/persian/test_nvda_real_plugin.py --work persian-nvda-results
          if ($LASTEXITCODE -ne 0) { throw 'Actual NVDA Persian profile test failed' }
          python -B addon/test_nvda_real_settings.py --nvda portable-nvda/nvda.exe --addon "$addon" --work persian-settings-results
          if ($LASTEXITCODE -ne 0) { throw 'Actual NVDA Persian acoustic clock settings failed' }
          python -B addon/test_nvda_real_segmentation.py --nvda portable-nvda/nvda.exe --addon "$addon" --extra-addon "$lab" --plugin experiments/persian/test_soundlab_real_plugin.py --work soundlab-nvda-results
          if ($LASTEXITCODE -ne 0) { throw 'Actual NVDA sound laboratory test failed' }
          python -B addon/test_nvda_real_segmentation.py --nvda portable-nvda/nvda.exe --addon "$addon" --extra-addon "$lab" --plugin experiments/persian/test_phoneme_editor_real_plugin.py --work phoneme-editor-nvda-results
          if ($LASTEXITCODE -ne 0) { throw 'Actual NVDA phoneme editor keyboard test failed' }
      - name: Show the NVDA test result after a failure
        if: failure()
        shell: bash
        run: |
          # The runner log can lose the test's own message; the result files keep it.
          for file in persian-nvda-results/*.json persian-settings-results/*.json soundlab-nvda-results/*.json phoneme-editor*/*.json; do
            [ -f "$file" ] || continue
            echo "== $file"
            python -B -c 'import json,sys; d=json.load(open(sys.argv[1],encoding="utf8")); print("ok:",d.get("ok")); print(str(d.get("error",""))[-6000:])' "$file" || head -c 6000 "$file"
            python -B -c 'import json,sys; d=json.load(open(sys.argv[1],encoding="utf8")); [print(json.dumps(r,ensure_ascii=True)[:1500]) for r in d.get("cases",[]) if "decimal" in str(r.get("spelling")) or "version" in str(r.get("text"))]' "$file" || true
          done
      - name: Confirm the full acoustic test
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run watch "${{ steps.acoustic.outputs.run_id }}" --exit-status --interval 15 --repo "$GITHUB_REPOSITORY"
          if [ "${{ steps.acoustic.outputs.early_run_id }}" != "${{ steps.acoustic.outputs.run_id }}" ]; then
            gh run download "${{ steps.acoustic.outputs.run_id }}" --name persian-windows-baseline-early --dir verified-acoustic --repo "$GITHUB_REPOSITORY"
            cmp -s candidate/eci.dll verified-acoustic/eci.dll || { echo 'The tested and fully verified Windows DLLs differ' >&2; exit 1; }
          fi
