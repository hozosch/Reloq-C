permissions:
  contents: read
  actions: read
concurrency:
  group: persian-nvda-direct-${{ github.ref }}
  cancel-in-progress: true
jobs:
  nvda:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check linked Delta PE inspection
        shell: pwsh
        run: |
          python -B tests/test_linked_delta_pe.py
          if ($LASTEXITCODE -ne 0) { throw 'Linked Delta PE inspection failed' }
      - name: Select verified Windows acoustics
        id: acoustic
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          selected=""
          acoustic_branch="$GITHUB_REF_NAME"
          selector_options=()
          if [ "$GITHUB_REF_NAME" = "codex/persian-virgule-20261120" ]; then
            acoustic_branch="codex/persian-native-transitions-20261120"
            selector_options=(--allow-branch-list-change)
          fi
          for attempt in $(seq 1 60); do
            gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/persian-windows-acoustic-probe.yml/runs" -f branch="$acoustic_branch" -F per_page=40 > windows-runs.json
            selected=$(python -B experiments/persian/select_windows_acoustic_run.py windows-runs.json "${selector_options[@]}")
            if [ -n "$selected" ]; then break; fi
            sleep 5
          done
          if [ -z "$selected" ]; then echo 'No compatible Windows acoustic build' >&2; exit 1; fi
          # A cancelled source-matching run may already have uploaded its
          # baseline. Test that binary while the new full acoustic run
          # finishes; compare the two DLLs after the full run succeeds.
          early_selected=$(python -B experiments/persian/select_windows_acoustic_run.py windows-runs.json "${selector_options[@]}" --include-cancelled)
          if [ -z "$early_selected" ]; then early_selected="$selected"; fi
          available=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$early_selected/artifacts?per_page=100" --jq '.artifacts[] | select(.name == "persian-windows-baseline-early" and .expired == false) | .id')
          if [ -z "$available" ]; then early_selected="$selected"; fi
          available=""
          for attempt in $(seq 1 240); do
            available=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$early_selected/artifacts?per_page=100" --jq '.artifacts[] | select(.name == "persian-windows-baseline-early" and .expired == false) | .id')
            if [ -n "$available" ]; then break; fi
            state=$(gh run view "$early_selected" --repo "$GITHUB_REPOSITORY" --json status --jq '.status')
            if [ "$state" = "completed" ]; then echo 'Acoustic job ended before the baseline was available' >&2; exit 1; fi
            sleep 5
          done
          if [ -z "$available" ]; then echo 'Timed out waiting for the Windows baseline' >&2; exit 1; fi
          # GitHub can list a newly uploaded artifact before its download is
          # available. Give the artifact store time to finish propagation;
          # otherwise the following action can fail with a transient 404.
          sleep 15
          echo "run_id=$selected" >> "$GITHUB_OUTPUT"
          echo "early_run_id=$early_selected" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v8
        with:
          name: persian-windows-baseline-early
          run-id: ${{ steps.acoustic.outputs.early_run_id }}
          github-token: ${{ github.token }}
          path: candidate
      - uses: actions/download-artifact@v8
        with:
          name: persian-windows-baseline-early
          run-id: 45169252099
          github-token: ${{ github.token }}
          path: previous-dev40-core
      - uses: actions/download-artifact@v8
        with:
          name: persian-windows-baseline-early
          run-id: 45176341225
          github-token: ${{ github.token }}
          path: previous-dev42-core
      - uses: actions/download-artifact@v8
        with:
          name: persian-windows-baseline-early
          run-id: 45190600463
          github-token: ${{ github.token }}
          path: previous-dev43-core
      - uses: actions/download-artifact@v8
        with:
          name: persian-windows-baseline-early
          run-id: 45197903992
          github-token: ${{ github.token }}
          path: previous-dev44-core
      - uses: actions/download-artifact@v8
        with:
          name: persian-windows-baseline-early
          run-id: 45205374376
          github-token: ${{ github.token }}
          path: previous-dev45-core
      - uses: actions/download-artifact@v8
        if: github.ref_name == 'codex/persian-core-dev47-20261123' || github.ref_name == 'codex/persian-stop-r-dev48-20261123' || github.ref_name == 'codex/persian-stop-r-dev49-20261123'
        with:
          name: persian-windows-baseline-early
          run-id: 45211752804
          github-token: ${{ github.token }}
          path: previous-dev46-core
      - name: Obtain portable NVDA
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download release-2026.3.1 --repo nvaccess/nvda --pattern nvda_2026.3.1.exe --dir candidate
          if ($LASTEXITCODE -ne 0) { throw 'NVDA download failed' }
          if ((Get-FileHash candidate/nvda_2026.3.1.exe -Algorithm SHA256).Hash -ne '6F80A5B0CA720A7D0D314B5BE212F37388BBE81A1107AC3298C1821A1CD3F052') { throw 'Unexpected NVDA installer' }
          $portable = Join-Path $pwd 'portable-nvda'
          $p = Start-Process (Get-Item candidate/nvda_2026.3.1.exe).FullName -ArgumentList '--create-portable-silent', "--portable-path=$portable" -Wait -PassThru
          if ($p.ExitCode -ne 0 -or !(Test-Path "$portable/synthDrivers/espeak.dll")) { throw 'NVDA portable installation failed' }
      - name: Check mixed Unicode name routing
        shell: pwsh
        env:
          PYTHONIOENCODING: utf-8
        run: |
          $dll = (Get-ChildItem candidate -Recurse -Filter eci.dll | Select-Object -First 1).FullName
          $espeak = (Resolve-Path portable-nvda/synthDrivers/espeak.dll).Path
          $data = (Resolve-Path portable-nvda/synthDrivers).Path
          python -B experiments/persian/test_english_apostrophes.py --library "$dll"
          if ($LASTEXITCODE -ne 0) { throw 'English apostrophe routing failed' }
          python -B experiments/persian/test_greek_running_text.py --library "$dll"
          if ($LASTEXITCODE -ne 0) { throw 'Greek letter routing failed' }
          python -B nvda/test_eci_unicode_single.py --library "$dll"
          if ($LASTEXITCODE -ne 0) { throw 'Running Greek and Unicode isolation failed' }
          python -B experiments/persian/test_unicode_fallback_routing.py --native-library "$dll" --scope-probe "$dll" --espeak-library "$espeak" --data-parent "$data"
          if ($LASTEXITCODE -ne 0) { throw 'Mixed Unicode name routing failed' }
          python -B experiments/persian/test_alave_vowel.py --native-library "$dll" --scope-probe "$dll" --espeak-library "$espeak" --data-parent "$data"
          if ($LASTEXITCODE -ne 0) { throw 'Persian alave or plus pronunciation failed' }
          python -B experiments/persian/test_us_contour_runtime.py --library "$dll"
          if ($LASTEXITCODE -ne 0) { throw 'Persian US contour, weak words or final vowels failed' }
          python -B experiments/persian/test_native_us_word_contour.py --library "$dll"
          if ($LASTEXITCODE -ne 0) { throw 'Native US word contour failed' }
          python -B experiments/persian/test_native_us_z_onset.py --library "$dll"
          if ($LASTEXITCODE -ne 0) { throw 'Native Persian US fricative transition failed' }
          python -B experiments/persian/test_us_fricative_transition.py --library "$dll"
          if ($LASTEXITCODE -ne 0) { throw 'Mixed Persian US fricative transition failed' }
          python -B experiments/persian/test_us_unvoiced_onsets.py --library "$dll"
          if ($LASTEXITCODE -ne 0) { throw 'Mixed Persian US consonant transition failed' }
          python -B experiments/persian/test_persian_front_a_duration.py --library "$dll"
          if ($LASTEXITCODE -ne 0) { throw 'Persian short A timing failed' }
          python -B experiments/persian/test_persian_r_source.py --library "$dll"
          if ($LASTEXITCODE -ne 0) { throw 'Persian R source transition failed' }
          python -B experiments/persian/test_persian_u_final_r_voice.py --library "$dll" --previous previous-dev40-core/eci.dll
          if ($LASTEXITCODE -ne 0) { throw 'Persian final R after U failed' }
          python -B experiments/persian/test_persian_u_final_r_spectrum.py --candidate "$dll" --previous previous-dev40-core/eci.dll
          if ($LASTEXITCODE -ne 0) { throw 'Persian voiced final R spectrum failed' }
          python -B experiments/persian/test_persian_r_voice_resonance.py --library "$dll" --previous previous-dev42-core/eci.dll
          if ($LASTEXITCODE -ne 0) { throw 'Persian R resonance or noise preservation failed' }
          python -B experiments/persian/test_persian_u_r_voice_release.py --library "$dll" --previous previous-dev43-core/eci.dll
          if ($LASTEXITCODE -ne 0) { throw 'Persian U-to-final-R voiced transition failed' }
          python -B experiments/persian/test_persian_u_r_upper_voice.py --library "$dll" --previous previous-dev44-core/eci.dll
          if ($LASTEXITCODE -ne 0) { throw 'Persian U and R upper-resonance isolation failed' }
          python -B experiments/persian/test_persian_r_i_voice_transition.py --library "$dll" --previous previous-dev45-core/eci.dll
          if ($LASTEXITCODE -ne 0) { throw 'Persian R-to-I voice, noise or accepted final U-R changed' }
          if (Test-Path previous-dev46-core/eci.dll) {
            python -B eci/test_persian_mixed_worker_reuse.py --library "$dll" --previous previous-dev46-core/eci.dll
            if ($LASTEXITCODE -ne 0) { throw 'Owned Persian English worker changed mixed output or state' }
          }
          python -B experiments/persian/test_classified_recovery.py --library "$dll" --previous previous-dev44-core/eci.dll
          if ($LASTEXITCODE -ne 0) { throw 'Persian word recovery or native pronunciation isolation failed' }
          python -B experiments/persian/test_classified_suffixes.py --library "$dll" --previous previous-dev43-core/eci.dll
          if ($LASTEXITCODE -ne 0) { throw 'Persian productive suffix recovery failed' }
          python -B experiments/persian/test_nominal_suffix_recovery.py --library "$dll" --previous previous-dev44-core/eci.dll --exhaustive
          if ($LASTEXITCODE -ne 0) { throw 'Persian nominal suffix recovery failed' }
          python -B experiments/persian/test_other_language_isolation.py --candidate "$dll" --previous previous-dev40-core/eci.dll
          if ($LASTEXITCODE -ne 0) { throw 'Other language acoustic isolation failed' }
          python -B experiments/persian/test_persian_o_r_transition.py --library "$dll"
          if ($LASTEXITCODE -ne 0) { throw 'Persian O-to-R resonance transition failed' }
          python -B experiments/persian/test_persian_back_vowel_r_transition.py --library "$dll"
          if ($LASTEXITCODE -ne 0) { throw 'Persian back-vowel and R resonance transition failed' }
          python -B experiments/persian/test_persian_final_r_transition.py --library "$dll"
          if ($LASTEXITCODE -ne 0) { throw 'Persian final-R resonance transition failed' }
          python -B experiments/persian/test_persian_acoustic_clock.py --library "$dll"
          if ($LASTEXITCODE -ne 0) { throw 'Persian and Pinglish acoustic clock failed' }
          python -B experiments/persian/test_native_us_nvda_route.py --library "$dll"
          if ($LASTEXITCODE -ne 0) { throw 'Native Persian NVDA sentence route failed' }
          python -B experiments/persian/test_native_us_nvda_specials.py --library "$dll"
          if ($LASTEXITCODE -ne 0) { throw 'Native Persian NVDA punctuation and source indexes failed' }
          python -B experiments/persian/benchmark_active_vs_native.py --library "$dll" --repeats 8
          if ($LASTEXITCODE -ne 0) { throw 'Native Persian sentence latency comparison failed' }
          python -B experiments/persian/test_lautlabor_project.py --library "$dll"
          if ($LASTEXITCODE -ne 0) { throw 'Saved Persian sound project differed from the laboratory' }
          python -B experiments/persian/test_persian_syllable_pitch.py --library "$dll"
          if ($LASTEXITCODE -ne 0) { throw 'Persian US syllable pitch alignment failed' }
          python -B experiments/persian/test_fa_sentence_flow.py --library "$dll" --espeak-library "$espeak" --data-parent "$data"
          if ($LASTEXITCODE -ne 0) { throw 'Persian sentence boundaries or number timing failed' }
          python -B experiments/persian/test_pure_sentence_streaming.py --library "$dll"
          if ($LASTEXITCODE -ne 0) { throw 'Persian sentence streaming or source indexes failed' }
          python -B experiments/persian/test_prefix_streaming.py --library "$dll"
          if ($LASTEXITCODE -ne 0) { throw 'Persian incremental playback or cancellation failed' }
          python -B nvda/test_eci_playback_queue.py
          if ($LASTEXITCODE -ne 0) { throw 'NVDA playback reserve or queue failed' }
          python -B experiments/persian/test_acoustic_run_selection.py
          if ($LASTEXITCODE -ne 0) { throw 'Windows acoustic artifact selection failed' }
          python -B experiments/persian/test_mixed_early_snapshot.py --library "$dll"
          if ($LASTEXITCODE -ne 0) { throw 'Mixed incremental playback or cancellation failed' }
          python -B experiments/persian/test_mixed_number_word_boundaries.py --library "$dll"
          if ($LASTEXITCODE -ne 0) { throw 'Grouped numbers cut a following Persian word' }
          python -B experiments/persian/test_stop_r_transition.py --library "$dll" --exhaustive
          if ($LASTEXITCODE -ne 0) { throw 'English stop to Persian R transition failed' }
          python -B nvda/test_eci_unicode_switch.py --library "$dll"
          if ($LASTEXITCODE -ne 0) { throw 'Unicode context across language switches failed' }
          python -B experiments/persian/test_pinglish_native_words.py --library "$dll"
          if ($LASTEXITCODE -ne 0) { throw 'Native Pinglish pronunciation mismatch' }
          python -B experiments/persian/test_pinglish_a_quality.py --library "$dll"
          if ($LASTEXITCODE -ne 0) { throw 'Pinglish a/aa distinction or shared paths failed' }
          python -B experiments/persian/compile_pinglish_extra.py --library "$dll" --check
          if ($LASTEXITCODE -ne 0) { throw 'Shared Pinglish symbol-name spellings are stale' }
          python -B experiments/persian/test_pinglish_phrase_projection.py --library "$dll"
          if ($LASTEXITCODE -ne 0) { throw 'Native Pinglish phrase or event projection differed' }
          python -B experiments/persian/test_persian_text_modes.py --library "$dll"
          if ($LASTEXITCODE -ne 0) { throw 'Persian and Pinglish shared frontend differed' }
          python -B experiments/persian/test_persian_phonetic_input.py --library "$dll"
          if ($LASTEXITCODE -ne 0) { throw 'Persian phonetic input failed' }
          python -B experiments/persian/test_persian_phonetic_contour.py --library "$dll"
          if ($LASTEXITCODE -ne 0) { throw 'Persian explicit phonetics lost the chosen contour' }
          python -B experiments/persian/test_native_glide_runtime.py --library "$dll"
          if ($LASTEXITCODE -ne 0) { throw 'Shared native glide changed Persian playback' }
          python -B experiments/persian/test_pure_parallel_pilot.py --library "$dll"
          if ($LASTEXITCODE -ne 0) { throw 'Persian parallel contour or cancellation failed' }
          python -B experiments/persian/test_persian_decimals.py
          if ($LASTEXITCODE -ne 0) { throw 'Persian NVDA version and dictionary processing failed' }
          python -B experiments/persian/test_persian_joiners.py
          if ($LASTEXITCODE -ne 0) { throw 'Persian NVDA punctuation and joiner preprocessing failed' }
          python -B experiments/persian/test_nvda_driver_probe.py
          if ($LASTEXITCODE -ne 0) { throw 'Persian NVDA language routing failed' }
          python -B experiments/persian/test_english_persian_preload.py --library "$dll"
