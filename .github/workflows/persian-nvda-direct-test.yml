name: Persian NVDA direct test
on:
  workflow_dispatch:
  push:
    branches: [codex/persian-issue49-followup-20261117, codex/persian-vowels-20261117, codex/persian-us-contour-20261117, codex/persian-adjectives-20261117, codex/persian-ra-pinglish-20261119, codex/persian-core-20261119, codex/persian-native-20261120, codex/persian-issue49-solh-20261120, codex/persian-native-transitions-20261120, codex/persian-native-fast-pilot-20261120, codex/persian-virgule-20261120]
    paths:
      - .github/workflows/persian-nvda-direct-test.yml
      - .github/workflows/persian-windows-acoustic-probe.yml
      - nvda/test_eci_upper_number.py
      - experiments/persian/test_long_word_timing.py
      - experiments/persian/test_mixed_control_pilot.py
      - experiments/persian/test_persian_virgule.py
      - tools/reuse_persian_provider_cache.py
      - experiments/persian/nvda_driver_probe.py
      - experiments/persian/hybrid_fa_frontend.py
      - experiments/persian/pinglish_frontend.py
      - include/reloq_persian_numbers.h
      - experiments/persian/test_persian_number_events.py
      - experiments/persian/test_persian_hundred.py
      - experiments/persian/test_persian_h_after_l.py
      - experiments/persian/build_experimental_nvda.py
      - experiments/persian/test_persian_decimals.py
      - experiments/persian/test_persian_joiners.py
      - experiments/persian/reference-nvda/fa_symbols_2026_3_1.dic
      - experiments/persian/test_decimal_routing.py
      - experiments/persian/test_direct_fa_numbers.py
      - experiments/persian/test_fa_orthography.py
      - experiments/persian/test_fa_morphology.py
      - experiments/persian/test_fa_stress_fallback.py
      - experiments/persian/test_persian_stop_transition.py
      - experiments/persian/test_persian_reference_boundary.py
      - experiments/persian/text_frontend.py
      - nvda/_reloq_persian_decimals.py
      - nvda/_reloq_persian_joiners.py
      - nvda/_reloq_languages.py
      - nvda/_reloq_persian_frames.py
      - nvda/_reloq_eci_transport.py
      - nvda/test_eci_playback_queue.py
      - experiments/persian/direct_fa_sequence.py
      - experiments/persian/continuous_driver.py
      - experiments/persian/continuous_plan.py
      - experiments/persian/parallel_pilot.py
      - experiments/persian/persian_symbols.py
      - experiments/persian/direct_fa_*.c
      - experiments/persian/direct_fa_*.h
      - experiments/persian/direct_fa_*.inc
      - src/reloq_persian_*.c
      - src/reloq_persian_*.h
      - .github/workflows/persian-windows-acoustic-probe.yml
      - experiments/persian/test_nvda_real_plugin.py
      - experiments/persian/test_unicode_fallback_routing.py
      - experiments/persian/test_resilient_runtime.py
      - experiments/persian/test_us_contour_runtime.py
      - experiments/persian/test_persian_r_after_i.py
      - experiments/persian/test_persian_r_after_i_contexts.py
      - experiments/persian/test_bakhtiari_football.py
      - experiments/persian/test_initial_vowel_timing.py
      - experiments/persian/test_reported_name_reference.py
      - experiments/persian/test_persian_vowel_hiatus.py
      - experiments/persian/test_pure_parallel_pilot.py
      - experiments/persian/test_pure_sentence_streaming.py
      - experiments/persian/test_prefix_streaming.py
      - experiments/persian/test_mixed_early_snapshot.py
      - experiments/persian/test_pinglish_native_words.py
      - experiments/persian/test_pinglish_phrase_projection.py
      - experiments/persian/test_persian_text_modes.py
      - experiments/persian/test_persian_phonetic_input.py
      - experiments/persian/test_persian_phonetic_contour.py
      - experiments/persian/test_native_glide_runtime.py
      - experiments/persian/test_r_metallic_edge.py
      - experiments/persian/test_persian_final_r_connected.py
      - experiments/persian/test_persian_r_liaison.py
      - experiments/persian/test_persian_syllable_pitch.py
      - experiments/persian/test_fa_sentence_flow.py
      - experiments/persian/test_embedded_text_rules.py
      - experiments/persian/select_windows_acoustic_run.py
      - experiments/persian/test_acoustic_run_selection.py
      - experiments/persian/build_soundlab_nvda.py
      - experiments/persian/test_soundlab_nvda.py
      - experiments/persian/test_soundlab_real_plugin.py
      - experiments/persian/test_phoneme_editor.py
      - experiments/persian/test_phoneme_editor_real_plugin.py
      - experiments/persian/test_persian_acoustic_clock.py
      - experiments/persian/test_lautlabor_project.py
      - addon/soundlab/**
permissions:
  contents: read
  actions: read
concurrency:
  group: persian-nvda-direct-${{ github.ref }}
  cancel-in-progress: true
jobs:
  nvda:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select verified Windows acoustics
        id: acoustic
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          selected=""
          acoustic_branch="$GITHUB_REF_NAME"
          selector_options=()
          if [ "$GITHUB_REF_NAME" = "codex/persian-virgule-20261120" ]; then
            acoustic_branch="codex/persian-native-transitions-20261120"
            selector_options=(--allow-branch-list-change)
          fi
          for attempt in $(seq 1 60); do
            gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/persian-windows-acoustic-probe.yml/runs" -f branch="$acoustic_branch" -F per_page=40 > windows-runs.json
            selected=$(python -B experiments/persian/select_windows_acoustic_run.py windows-runs.json "${selector_options[@]}")
            if [ -n "$selected" ]; then break; fi
            sleep 5
          done
          if [ -z "$selected" ]; then echo 'No compatible Windows acoustic build' >&2; exit 1; fi
          # A cancelled source-matching run may already have uploaded its
          # baseline. Test that binary while the new full acoustic run
          # finishes; compare the two DLLs after the full run succeeds.
          early_selected=$(python -B experiments/persian/select_windows_acoustic_run.py windows-runs.json "${selector_options[@]}" --include-cancelled)
          if [ -z "$early_selected" ]; then early_selected="$selected"; fi
          available=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$early_selected/artifacts?per_page=100" --jq '.artifacts[] | select(.name == "persian-windows-baseline-early" and .expired == false) | .id')
          if [ -z "$available" ]; then early_selected="$selected"; fi
          available=""
          for attempt in $(seq 1 240); do
            available=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$early_selected/artifacts?per_page=100" --jq '.artifacts[] | select(.name == "persian-windows-baseline-early" and .expired == false) | .id')
            if [ -n "$available" ]; then break; fi
            state=$(gh run view "$early_selected" --repo "$GITHUB_REPOSITORY" --json status --jq '.status')
            if [ "$state" = "completed" ]; then echo 'Acoustic job ended before the baseline was available' >&2; exit 1; fi
            sleep 5
          done
          if [ -z "$available" ]; then echo 'Timed out waiting for the Windows baseline' >&2; exit 1; fi
          echo "run_id=$selected" >> "$GITHUB_OUTPUT"
          echo "early_run_id=$early_selected" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          name: persian-windows-baseline-early
          run-id: ${{ steps.acoustic.outputs.early_run_id }}
          github-token: ${{ github.token }}
          path: candidate
      - name: Obtain portable NVDA
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download release-2026.3.1 --repo nvaccess/nvda --pattern nvda_2026.3.1.exe --dir candidate
          if ($LASTEXITCODE -ne 0) { throw 'NVDA download failed' }
          if ((Get-FileHash candidate/nvda_2026.3.1.exe -Algorithm SHA256).Hash -ne '6F80A5B0CA720A7D0D314B5BE212F37388BBE81A1107AC3298C1821A1CD3F052') { throw 'Unexpected NVDA installer' }
          $portable = Join-Path $pwd 'portable-nvda'
          $p = Start-Process (Get-Item candidate/nvda_2026.3.1.exe).FullName -ArgumentList '--create-portable-silent', "--portable-path=$portable" -Wait -PassThru
          if ($p.ExitCode -ne 0 -or !(Test-Path "$portable/synthDrivers/espeak.dll")) { throw 'NVDA portable installation failed' }
      - name: Check mixed Unicode name routing
        shell: pwsh
        env:
          PYTHONIOENCODING: utf-8
        run: |
          $dll = (Get-ChildItem candidate -Recurse -Filter eci.dll | Select-Object -First 1).FullName
          $espeak = (Resolve-Path portable-nvda/synthDrivers/espeak.dll).Path
          $data = (Resolve-Path portable-nvda/synthDrivers).Path
          python -B experiments/persian/test_unicode_fallback_routing.py --native-library "$dll" --scope-probe "$dll" --espeak-library "$espeak" --data-parent "$data"
          if ($LASTEXITCODE -ne 0) { throw 'Mixed Unicode name routing failed' }
          python -B experiments/persian/test_us_contour_runtime.py --library "$dll"
          if ($LASTEXITCODE -ne 0) { throw 'Persian US contour, weak words or final vowels failed' }
          python -B experiments/persian/test_native_us_word_contour.py --library "$dll"
          if ($LASTEXITCODE -ne 0) { throw 'Native US word contour failed' }
          python -B experiments/persian/test_persian_acoustic_clock.py --library "$dll"
          if ($LASTEXITCODE -ne 0) { throw 'Persian and Pinglish acoustic clock failed' }
          python -B experiments/persian/test_lautlabor_project.py --library "$dll"
          if ($LASTEXITCODE -ne 0) { throw 'Saved Persian sound project differed from the laboratory' }
          python -B experiments/persian/test_persian_syllable_pitch.py --library "$dll"
          if ($LASTEXITCODE -ne 0) { throw 'Persian US syllable pitch alignment failed' }
          python -B experiments/persian/test_fa_sentence_flow.py --library "$dll"
          if ($LASTEXITCODE -ne 0) { throw 'Persian sentence boundaries or number timing failed' }
          python -B experiments/persian/test_pure_sentence_streaming.py --library "$dll"
          if ($LASTEXITCODE -ne 0) { throw 'Persian sentence streaming or source indexes failed' }
          python -B experiments/persian/test_prefix_streaming.py --library "$dll"
          if ($LASTEXITCODE -ne 0) { throw 'Persian incremental playback or cancellation failed' }
          python -B nvda/test_eci_playback_queue.py
          if ($LASTEXITCODE -ne 0) { throw 'NVDA playback reserve or queue failed' }
          python -B experiments/persian/test_acoustic_run_selection.py
          if ($LASTEXITCODE -ne 0) { throw 'Windows acoustic artifact selection failed' }
          python -B experiments/persian/test_mixed_early_snapshot.py --library "$dll"
          if ($LASTEXITCODE -ne 0) { throw 'Mixed incremental playback or cancellation failed' }
          python -B experiments/persian/test_pinglish_native_words.py --library "$dll"
          if ($LASTEXITCODE -ne 0) { throw 'Native Pinglish pronunciation mismatch' }
          python -B experiments/persian/test_pinglish_phrase_projection.py --library "$dll"
          if ($LASTEXITCODE -ne 0) { throw 'Native Pinglish phrase or event projection differed' }
          python -B experiments/persian/test_persian_text_modes.py --library "$dll"
          if ($LASTEXITCODE -ne 0) { throw 'Persian and Pinglish shared frontend differed' }
          python -B experiments/persian/test_persian_phonetic_input.py --library "$dll"
          if ($LASTEXITCODE -ne 0) { throw 'Persian phonetic input failed' }
          python -B experiments/persian/test_persian_phonetic_contour.py --library "$dll"
          if ($LASTEXITCODE -ne 0) { throw 'Persian explicit phonetics lost the chosen contour' }
          python -B experiments/persian/test_native_glide_runtime.py --library "$dll"
          if ($LASTEXITCODE -ne 0) { throw 'Shared native glide changed Persian playback' }
          python -B experiments/persian/test_pure_parallel_pilot.py --library "$dll"
          if ($LASTEXITCODE -ne 0) { throw 'Persian parallel contour or cancellation failed' }
          python -B experiments/persian/test_persian_decimals.py
          if ($LASTEXITCODE -ne 0) { throw 'Persian NVDA version and dictionary processing failed' }
          python -B experiments/persian/test_persian_joiners.py
          if ($LASTEXITCODE -ne 0) { throw 'Persian NVDA punctuation and joiner preprocessing failed' }
          python -B experiments/persian/test_persian_number_events.py --library "$dll"
          if ($LASTEXITCODE -ne 0) { throw 'Structured native Persian number analysis failed' }
          python -B experiments/persian/test_persian_hundred.py --library "$dll"
          if ($LASTEXITCODE -ne 0) { throw 'Persian hundred-group timing failed' }
          python -B experiments/persian/test_persian_h_after_l.py --library "$dll"
          if ($LASTEXITCODE -ne 0) { throw 'Persian h after l is not audible' }
          python -B experiments/persian/test_persian_final_h_after_consonant.py --library "$dll"
          if ($LASTEXITCODE -ne 0) { throw 'Persian final h impulse failed' }
          python -B experiments/persian/test_persian_r_after_i_contexts.py --library "$dll"
          if ($LASTEXITCODE -ne 0) { throw 'Persian medial r after i failed' }
          python -B experiments/persian/test_bakhtiari_football.py --library "$dll"
          if ($LASTEXITCODE -ne 0) { throw 'Persian Bakhtiari or football acoustics failed' }
          python -B experiments/persian/test_initial_vowel_timing.py --library "$dll"
          if ($LASTEXITCODE -ne 0) { throw 'Persian first-vowel timing failed' }
          python -B experiments/persian/test_persian_vowel_hiatus.py --library "$dll"
          if ($LASTEXITCODE -ne 0) { throw 'Persian unstressed hiatus timing failed' }
          python -B experiments/persian/test_r_metallic_edge.py --library "$dll"
          if ($LASTEXITCODE -ne 0) { throw 'Persian metallic R transition failed' }
          python -B experiments/persian/test_fa_orthography.py --library "$dll"
          if ($LASTEXITCODE -ne 0) { throw 'Independent Persian orthography rules failed' }
          python -B experiments/persian/test_fa_morphology.py --library "$dll"
          if ($LASTEXITCODE -ne 0) { throw 'Persian morphology and stress failed' }
          python -B experiments/persian/test_fa_stress_fallback.py --library "$dll"
          if ($LASTEXITCODE -ne 0) { throw 'Persian native and fallback stress isolation failed' }
          python -B experiments/persian/test_reported_name_reference.py --library "$dll" --espeak "$espeak" --data "$data"
          if ($LASTEXITCODE -ne 0) { throw 'Reported Persian name projection failed' }
          python -B experiments/persian/test_decimal_routing.py --native-library "$dll" --scope-probe "$dll" --espeak-library "$espeak" --data-parent "$data"
          if ($LASTEXITCODE -ne 0) { throw 'English and Pinglish number routing failed' }
          python -B experiments/persian/test_resilient_runtime.py --native-library "$dll" --scope-probe "$dll" --espeak-library "$espeak" --data-parent "$data"
          if ($LASTEXITCODE -ne 0) { throw 'Persian symbols or mixed speech failed' }
          python -B experiments/persian/test_persian_stop_transition.py --library "$dll"
          if ($LASTEXITCODE -ne 0) { throw 'Persian mixed-language stop transition failed' }
          python -B nvda/test_eci_upper_number.py --library "$dll"
          if ($LASTEXITCODE -ne 0) { throw 'Uppercase words with attached numbers failed' }
          python -B experiments/persian/test_long_word_timing.py --library "$dll"
          if ($LASTEXITCODE -ne 0) { throw 'Persian long-word timing failed' }
          python -B experiments/persian/test_mixed_control_pilot.py --library "$dll"
          if ($LASTEXITCODE -ne 0) { throw 'Mixed control-only pilot failed' }
          python -B experiments/persian/test_persian_virgule.py --library "$dll" --espeak-library "$espeak" --data-parent "$data"
          if ($LASTEXITCODE -ne 0) { throw 'Mixed bracket punctuation was named unexpectedly' }
          python -B experiments/persian/test_persian_reference_boundary.py --library "$dll" --espeak-library "$espeak" --data-parent "$data"
          if ($LASTEXITCODE -ne 0) { throw 'Persian reference boundary and index mapping failed' }
      - name: Build private NVDA test add-on
        shell: bash
        run: |
          export PATH="/c/mingw64/bin:/c/msys64/usr/bin:$PATH"
          if [ "$GITHUB_REF_NAME" = "codex/persian-virgule-20261120" ]; then version=1.5.0-dev182; elif [ "$GITHUB_REF_NAME" = "codex/persian-native-fast-pilot-20261120" ]; then version=1.5.0-dev181; elif [ "$GITHUB_REF_NAME" = "codex/persian-native-transitions-20261120" ]; then version=1.5.0-dev180; elif [ "$GITHUB_REF_NAME" = "codex/persian-issue49-solh-20261120" ]; then version=1.5.0-dev179; elif [ "$GITHUB_REF_NAME" = "codex/persian-native-20261120" ]; then version=1.5.0-dev175; elif [ "$GITHUB_REF_NAME" = "codex/persian-core-20261119" ]; then version=1.5.0-dev174; elif [ "$GITHUB_REF_NAME" = "codex/persian-ra-pinglish-20261119" ]; then version=1.5.0-dev173; elif [ "$GITHUB_REF_NAME" = "codex/persian-adjectives-20261117" ]; then version=1.5.0-dev172; elif [ "$GITHUB_REF_NAME" = "codex/persian-us-contour-20261117" ]; then version=1.5.0-dev143; elif [ "$GITHUB_REF_NAME" = "codex/persian-vowels-20261117" ]; then version=1.5.0-dev142; else version=1.5.0-dev141; fi
          dll=$(find candidate -name eci.dll -print -quit)
          python -B experiments/persian/build_experimental_nvda.py --dll "$dll" --version "$version" --output "dist/reloq-c-persian-pinglish-$version.nvda-addon"
          python -B experiments/persian/build_soundlab_nvda.py --output dist/reloq-c-lautlabor-0.2.0.nvda-addon
      - name: Test in real NVDA
        shell: pwsh
        env:
          PYTHONIOENCODING: utf-8
        run: |
          $addon = (Get-ChildItem dist -Filter 'reloq-c-persian-pinglish-*.nvda-addon' | Select-Object -First 1).FullName
          $lab = (Get-ChildItem dist -Filter 'reloq-c-lautlabor-*.nvda-addon' | Select-Object -First 1).FullName
          $dll = (Get-ChildItem candidate -Recurse -Filter eci.dll | Select-Object -First 1).FullName
          python -B experiments/persian/test_soundlab_nvda.py --dll "$dll" --espeak portable-nvda/synthDrivers/espeak.dll --data portable-nvda/synthDrivers
          if ($LASTEXITCODE -ne 0) { throw 'Sound laboratory frame and language test failed' }
          python -B experiments/persian/test_phoneme_editor.py --dll "$dll"
          if ($LASTEXITCODE -ne 0) { throw 'Native phoneme editor and resonance filters failed' }
          python -B addon/test_nvda_real_segmentation.py --nvda portable-nvda/nvda.exe --addon "$addon" --plugin experiments/persian/test_nvda_real_plugin.py --work persian-nvda-results
          if ($LASTEXITCODE -ne 0) { throw 'Actual NVDA Persian profile test failed' }
          python -B addon/test_nvda_real_segmentation.py --nvda portable-nvda/nvda.exe --addon "$addon" --extra-addon "$lab" --plugin experiments/persian/test_soundlab_real_plugin.py --work soundlab-nvda-results
          if ($LASTEXITCODE -ne 0) { throw 'Actual NVDA sound laboratory test failed' }
          python -B addon/test_nvda_real_segmentation.py --nvda portable-nvda/nvda.exe --addon "$addon" --extra-addon "$lab" --plugin experiments/persian/test_phoneme_editor_real_plugin.py --work phoneme-editor-nvda-results
          if ($LASTEXITCODE -ne 0) { throw 'Actual NVDA phoneme editor keyboard test failed' }
      - name: Confirm the full acoustic test
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run watch "${{ steps.acoustic.outputs.run_id }}" --exit-status --interval 15 --repo "$GITHUB_REPOSITORY"
          if [ "${{ steps.acoustic.outputs.early_run_id }}" != "${{ steps.acoustic.outputs.run_id }}" ]; then
            gh run download "${{ steps.acoustic.outputs.run_id }}" --name persian-windows-baseline-early --dir verified-acoustic --repo "$GITHUB_REPOSITORY"
            cmp -s candidate/eci.dll verified-acoustic/eci.dll || { echo 'The tested and fully verified Windows DLLs differ' >&2; exit 1; }
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: persian-nvda-direct-package
          path: dist/*.nvda-addon
          if-no-files-found: warn
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: persian-nvda-direct-results
          path: |
            persian-nvda-results/result.json
            persian-nvda-results/nvda.log
            soundlab-nvda-results/result.json
            soundlab-nvda-results/nvda.log
            phoneme-editor-nvda-results/result.json
            phoneme-editor-nvda-results/nvda.log
          if-no-files-found: ignore
          retention-days: 7
