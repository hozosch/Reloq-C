name: Persian and Pinglish NVDA test package
on:
  workflow_dispatch:
  push:
    branches: [codex/persian-nvda-prep-20261115, codex/persian-clarity-20261116]
    paths:
      - experiments/persian/build_experimental_nvda.py
      - experiments/persian/select_windows_acoustic_run.py
      - experiments/persian/test_acoustic_run_selection.py
      - experiments/persian/build_native_probe.py
      - experiments/persian/build_windows_probe.py
      - experiments/persian/scoped_acoustics_probe.c
      - tools/prepare_persian_provider.py
      - src/reloq_persian_acoustics.c
      - src/reloq_persian_acoustics.h
      - src/reloq_persian_frames.c
      - src/reloq_persian_frame_internal.h
      - src/reloq_eci.c
      - src/reloq_rules61.c
      - src/reloq_persian_direct.h
      - include/reloq_eci.h
      - vendor/openevv61/Makefile.native
      - vendor/openevv61/src/eci/lang/eci_voicetable.c
      - vendor/openevv61/src/eci/api/eci_dllobj.c
      - vendor/openevv61/src/port/evv_arena.c
      - vendor/openevv61/src/port/port_win32.c
      - vendor/openevv61/src/delta/delta_low.c
      - vendor/openevv61/src/reloq61_bridge.c
      - eci/Makefile
      - eci/test_persian_acoustics.py
      - eci/test_concurrent_startup.py
      - tests/test_low_arena_concurrent.c
      - experiments/persian/test_nvda_package_probe.py
      - experiments/persian/test_nvda_real_plugin.py
      - experiments/persian/pinglish_frontend.py
      - experiments/persian/persian_symbols.py
      - experiments/persian/test_pinglish_driver.py
      - experiments/persian/test_direct_fa_letters.py
      - experiments/persian/test_direct_fa_characters.py
      - experiments/persian/test_direct_fa_compounds.py
      - experiments/persian/test_persian_joiners.py
      - experiments/persian/test_direct_fa_sequence.py
      - experiments/persian/hybrid_fa_frontend.py
      - experiments/persian/direct_fa_sequence.py
      - experiments/persian/continuous_driver.py
      - experiments/persian/continuous_plan.py
      - experiments/persian/test_continuous_runtime.py
      - experiments/persian/test_mixed_pitch_edges.py
      - experiments/persian/test_streamed_sentence.py
      - experiments/persian/test_fricative_identity.py
      - experiments/persian/test_us_consonants.py
      - experiments/persian/test_us_nasals.py
      - experiments/persian/test_open_vowels.py
      - experiments/persian/test_yek_duration.py
      - experiments/persian/test_british_front_a.py
      - experiments/persian/test_front_a_harmonics.py
      - experiments/persian/test_unvoiced_switch.py
      - experiments/persian/test_decimal_routing.py
      - experiments/persian/benchmark_uncached.py
      - experiments/persian/compare_vowel_corpus.py
      - experiments/persian/test_compare_vowel_corpus.py
      - experiments/persian/parallel_pilot.py
      - experiments/persian/korean_contour.py
      - experiments/persian/compare_korean_sources.py
      - experiments/persian/compare_korean_grouping.py
      - experiments/persian/test_korean_pitch_transfer.py
      - experiments/persian/test_korean_contour_runtime.py
      - experiments/persian/test_parallel_pilot.py
      - experiments/persian/test_alamat_vowel.py
      - experiments/persian/test_alave_vowel.py
      - experiments/persian/test_embedded_text_rules.py
      - experiments/persian/reference_alamat_timing.jsonl
      - experiments/persian/test_native_transition.py
      - experiments/persian/test_front_a_anchor.py
      - experiments/persian/test_resilient_runtime.py
      - experiments/persian/test_persian_eci_tags.py
      - experiments/persian/test_nvda_driver_probe.py
      - experiments/persian/continuous_frames.c
      - experiments/persian/continuous_frames.h
      - experiments/persian/continuous_replay.inc
      - experiments/persian/prepare_continuous_host.py
      - experiments/persian/reference_alignment.py
      - experiments/persian/espeak_worker.py
      - experiments/persian/espeak_worker.c
      - experiments/persian/espeak_ng_probe.py
      - experiments/persian/inprocess_espeak.py
      - experiments/persian/test_inprocess_espeak.py
      - experiments/persian/text_frontend.py
      - experiments/persian/direct_fa_*.c
      - experiments/persian/direct_fa_*.h
      - experiments/persian/direct_fa_*.inc
      - experiments/persian/nvda_driver_probe.py
      - nvda/_reloq_persian_bridge.py
      - nvda/_reloq_persian_joiners.py
      - nvda/_reloq_persian_decimals.py
      - experiments/persian/test_persian_decimals.py
      - experiments/persian/test_persian_number_boundaries.py
      - nvda/_reloq_persian_projection.py
      - nvda/_reloq_persian_frames.py
      - nvda/_reloq_persian_glide.py
      - nvda/_reloq_languages.py
      - .github/workflows/persian-nvda-package-probe.yml
      - .github/workflows/persian-windows-acoustic-probe.yml
permissions:
  contents: read
  actions: read
  checks: read
concurrency:
  group: persian-nvda-package-${{ github.ref }}
  cancel-in-progress: true
jobs:
  package:
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Wait for the selected Windows acoustic probe
        id: acoustic
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          selected=""
          for attempt in $(seq 1 60); do
            gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/persian-windows-acoustic-probe.yml/runs" -f branch="$GITHUB_REF_NAME" -F per_page=40 > windows-runs.json
            selected=$(python -B experiments/persian/select_windows_acoustic_run.py windows-runs.json)
            if [ -n "$selected" ]; then break; fi
            sleep 5
          done
          if [ -z "$selected" ]; then echo 'No matching Windows acoustic build' >&2; exit 1; fi
          gh run watch "$selected" --exit-status --interval 15 --repo "$GITHUB_REPOSITORY"
          echo "run_id=$selected" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          name: persian-windows-acoustic-probe
          run-id: ${{ steps.acoustic.outputs.run_id }}
          github-token: ${{ github.token }}
          path: candidate
      - name: Build the isolated eSpeak text worker
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -property installationPath
          if (!$vs) { throw 'Visual Studio C compiler was not found' }
          $envcmd = Join-Path $vs 'VC\Auxiliary\Build\vcvars64.bat'
          cmd.exe /d /c "`"$envcmd`" >nul && cl /nologo /O2 /W4 /std:c11 /Fe:fa-espeak-worker.exe experiments\persian\espeak_worker.c"
          if ($LASTEXITCODE -ne 0) { throw 'Text worker compilation failed' }
      - name: Obtain portable NVDA
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download release-2026.3.1 --repo nvaccess/nvda --pattern nvda_2026.3.1.exe --dir candidate
          if ($LASTEXITCODE -ne 0) { throw 'NVDA download failed' }
          if ((Get-FileHash candidate/nvda_2026.3.1.exe -Algorithm SHA256).Hash -ne '6F80A5B0CA720A7D0D314B5BE212F37388BBE81A1107AC3298C1821A1CD3F052') { throw 'Unexpected NVDA installer' }
          $portable = Join-Path $pwd 'portable-nvda'
          $p = Start-Process (Get-Item candidate/nvda_2026.3.1.exe).FullName -ArgumentList '--create-portable-silent', "--portable-path=$portable" -Wait -PassThru
          if ($p.ExitCode -ne 0 -or !(Test-Path "$portable/synthDrivers/espeak.dll")) { throw 'NVDA portable installation failed' }
      - name: Verify the package adapter with the real Windows DLL
        shell: pwsh
        env:
          PYTHONIOENCODING: utf-8
        run: |
          $dll = (Get-ChildItem candidate -Recurse -Filter eci_persian_probe.dll | Select-Object -First 1).FullName
          $espeak = (Resolve-Path portable-nvda/synthDrivers/espeak.dll).Path
          $data = (Resolve-Path portable-nvda/synthDrivers).Path
          python -B experiments/persian/test_inprocess_espeak.py --native-library "$dll" --scope-probe "$dll" --worker "$pwd/fa-espeak-worker.exe" --espeak-library "$espeak" --data-parent "$data"
          if ($LASTEXITCODE -ne 0) { throw 'In-process eSpeak isolation, cancellation or parity failed' }
          python -B experiments/persian/test_persian_decimals.py
          if ($LASTEXITCODE -ne 0) { throw 'Persian NVDA decimal preprocessing failed' }
          python -B experiments/persian/test_persian_joiners.py
          if ($LASTEXITCODE -ne 0) { throw 'Persian NVDA emoji and joiner preprocessing failed' }
          python -B experiments/persian/test_direct_fa_characters.py --library "$dll"
          if ($LASTEXITCODE -ne 0) { throw 'Persian native character names failed' }
          python -B experiments/persian/test_direct_fa_compounds.py --library "$dll" --espeak-library "$espeak" --data-parent "$data"
          if ($LASTEXITCODE -ne 0) { throw 'Persian native compound rules failed' }
          python -B experiments/persian/test_persian_number_boundaries.py --library "$dll"
          if ($LASTEXITCODE -ne 0) { throw 'Persian numeric boundary pronunciation failed' }
          python -B experiments/persian/test_korean_pitch_transfer.py --library "$dll"
          if ($LASTEXITCODE -ne 0) { throw 'Korean contour transfer failed' }
          python -B experiments/persian/test_korean_contour_runtime.py --library "$dll" --espeak-library "$espeak" --data-parent "$data"
          if ($LASTEXITCODE -ne 0) { throw 'Korean contour runtime failed' }
          python -B experiments/persian/compare_korean_sources.py --candidate "$dll" --espeak-library "$espeak" --data-parent "$data" --check-runtime --output persian-timing/korean-source-comparison.wav
          if ($LASTEXITCODE -ne 0) { throw 'Korean reference and runtime comparison failed' }
          python -B experiments/persian/compare_korean_grouping.py --candidate "$dll" --espeak-library "$espeak" --data-parent "$data" --check-runtime --output persian-timing/korean-grouping-comparison.wav
          if ($LASTEXITCODE -ne 0) { throw 'Korean grouped contour comparison failed' }
          python -B experiments/persian/test_acoustic_run_selection.py
          if ($LASTEXITCODE -ne 0) { throw 'Windows acoustic reuse selection failed' }
          python -B experiments/persian/test_compare_vowel_corpus.py
          if ($LASTEXITCODE -ne 0) { throw 'Persian vowel corpus pairing failed' }
          python -B experiments/persian/compare_vowel_corpus.py --espeak-only --native-library "$dll" --espeak-library "$espeak" --data-parent "$data" --output persian-timing/espeak-vowels.json
          if ($LASTEXITCODE -ne 0) { throw 'NVDA eSpeak vowel reference measurement failed' }
          python -B experiments/persian/compare_vowel_corpus.py --espeak-only --native-library "$dll" --espeak-library "$espeak" --data-parent "$data" --corpus experiments/persian/reference_alamat_timing.jsonl --output persian-timing/espeak-alamat.json
          if ($LASTEXITCODE -ne 0) { throw 'NVDA eSpeak alāmat measurement failed' }
          python -B experiments/persian/test_nvda_package_probe.py --native-library "$dll" --worker "$pwd/fa-espeak-worker.exe" --espeak-library "$espeak" --data-parent "$data"
          if ($LASTEXITCODE -ne 0) { throw 'Windows package adapter failed' }
          $common = (Get-ChildItem candidate -Recurse -Filter eci.dll | Select-Object -First 1).FullName
          python -B experiments/persian/test_direct_fa_characters.py --library "$common"
          if ($LASTEXITCODE -ne 0) { throw 'Shared ECI Persian character names failed' }
          python -B experiments/persian/test_persian_number_boundaries.py --library "$common"
          if ($LASTEXITCODE -ne 0) { throw 'Shared ECI Persian numeric boundary pronunciation failed' }
          python -B experiments/persian/test_korean_contour_runtime.py --library "$common" --espeak-library "$espeak" --data-parent "$data"
          if ($LASTEXITCODE -ne 0) { throw 'Shared ECI Korean contour runtime failed' }
          python -B experiments/persian/test_nvda_package_probe.py --native-library "$common" --worker "$pwd/fa-espeak-worker.exe" --espeak-library "$espeak" --data-parent "$data"
          if ($LASTEXITCODE -ne 0) { throw 'Shared Windows ECI package adapter failed' }
          python -B experiments/persian/test_streamed_sentence.py --native-library "$common" --scope-probe "$common" --espeak-library "$espeak" --data-parent "$data"
          if ($LASTEXITCODE -ne 0) { throw 'Shared ECI incremental sentence or cancellation failed' }
          python -B experiments/persian/test_fricative_identity.py --native-library "$common" --scope-probe "$common" --espeak-library "$espeak" --data-parent "$data"
          if ($LASTEXITCODE -ne 0) { throw 'Persian SH and X identity failed' }
          python -B experiments/persian/test_pinglish_driver.py --native-library "$dll" --scope-probe "$dll" --espeak-library "$espeak" --data-parent "$data"
          if ($LASTEXITCODE -ne 0) { throw 'Windows Pinglish playback failed' }
          python -B experiments/persian/test_nvda_driver_probe.py --native-library "$dll" --scope-probe "$dll" --espeak-library "$espeak" --data-parent "$data"
          if ($LASTEXITCODE -ne 0) { throw 'Windows Persian language switching failed' }
          python -B experiments/persian/test_continuous_runtime.py --native-library "$dll" --scope-probe "$dll" --espeak-library "$espeak" --data-parent "$data"
          if ($LASTEXITCODE -ne 0) { throw 'Windows continuous sentence and source indexes failed' }
          python -B experiments/persian/test_mixed_pitch_edges.py --library "$common"
          if ($LASTEXITCODE -ne 0) { throw 'English pitch preservation failed' }
          python -B experiments/persian/test_streamed_sentence.py --native-library "$dll" --scope-probe "$dll" --espeak-library "$espeak" --data-parent "$data"
          if ($LASTEXITCODE -ne 0) { throw 'Windows incremental sentence, recovery or cancellation failed' }
          python -B experiments/persian/test_parallel_pilot.py --native-library "$dll" --scope-probe "$dll" --espeak-library "$espeak" --data-parent "$data"
          if ($LASTEXITCODE -ne 0) { throw 'Windows parallel contour, settings or cancellation failed' }
          python -B experiments/persian/test_alamat_vowel.py --native-library "$dll" --scope-probe "$dll" --espeak-library "$espeak" --data-parent "$data"
          if ($LASTEXITCODE -ne 0) { throw 'Windows alāmat vowel and spelling checks failed' }
          python -B experiments/persian/test_alave_vowel.py --native-library "$dll" --scope-probe "$dll" --espeak-library "$espeak" --data-parent "$data"
          if ($LASTEXITCODE -ne 0) { throw 'Windows alāve vowel and spelling checks failed' }
          python -B experiments/persian/test_unvoiced_switch.py --native-library "$dll" --scope-probe "$dll" --worker "$pwd/fa-espeak-worker.exe" --espeak-library "$espeak" --data-parent "$data"
          if ($LASTEXITCODE -ne 0) { throw 'Windows voiceless language transitions failed' }
          python -B experiments/persian/test_decimal_routing.py --native-library "$dll" --scope-probe "$dll" --espeak-library "$espeak" --data-parent "$data"
          if ($LASTEXITCODE -ne 0) { throw 'English and Pinglish decimal routing failed' }
          python -B experiments/persian/benchmark_uncached.py --native-library "$dll" --scope-probe "$dll" --espeak-library "$espeak" --data-parent "$data" --output persian-timing/uncached-timing.json
          if ($LASTEXITCODE -ne 0) { throw 'Windows uncached response benchmark failed' }
          python -B experiments/persian/benchmark_uncached.py --native-library "$common" --scope-probe "$common" --espeak-library "$espeak" --data-parent "$data" --output persian-timing/uncached-shared-core.json
          if ($LASTEXITCODE -ne 0) { throw 'Shared Windows ECI response benchmark failed' }
          python -B experiments/persian/test_native_transition.py --probe "$dll"
          if ($LASTEXITCODE -ne 0) { throw 'US-guided Persian continuation failed' }
          python -B experiments/persian/test_front_a_anchor.py --probe "$dll"
          if ($LASTEXITCODE -ne 0) { throw 'Persian short-front vowel anchor failed' }
          python -B experiments/persian/test_yek_duration.py --candidate "$dll"
          if ($LASTEXITCODE -ne 0) { throw 'Persian yek timing failed' }
          python -B experiments/persian/test_resilient_runtime.py --native-library "$dll" --scope-probe "$dll" --espeak-library "$espeak" --data-parent "$data"
          if ($LASTEXITCODE -ne 0) { throw 'Windows resilient input and English exceptions failed' }
          python -B experiments/persian/test_persian_eci_tags.py --native-library "$dll" --scope-probe "$dll" --espeak-library "$espeak" --data-parent "$data"
          if ($LASTEXITCODE -ne 0) { throw 'Persian ECI tags or stress preservation failed' }
          python -B experiments/persian/test_direct_fa_letters.py --native-library "$dll" --worker "$pwd/fa-espeak-worker.exe" --espeak-library "$espeak" --data-parent "$data"
          if ($LASTEXITCODE -ne 0) { throw 'Windows Persian spelling failed' }
      - name: Build the private NVDA test add-on
        shell: bash
        run: |
          export PATH="/c/mingw64/bin:/c/msys64/usr/bin:$PATH"
          dll=$(find candidate -name eci.dll -print -quit)
          python -B experiments/persian/build_experimental_nvda.py --dll "$dll" --output dist/reloq-c-persian-pinglish-1.5.0-dev137.nvda-addon
      - name: Test the candidate in real NVDA
        shell: pwsh
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python -B addon/test_nvda_real_segmentation.py --nvda portable-nvda/nvda.exe --addon dist/reloq-c-persian-pinglish-1.5.0-dev137.nvda-addon --plugin experiments/persian/test_nvda_real_plugin.py --work persian-nvda-results
          if ($LASTEXITCODE -ne 0) { throw 'Actual NVDA Persian profile test failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: persian-pinglish-nvda-test
          path: dist/*.nvda-addon
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: persian-pinglish-nvda-test-results
          path: |
            persian-nvda-results/result.json
            persian-nvda-results/comparison_*.wav
            persian-nvda-results/nvda.log
            persian-timing/uncached-timing.json
            persian-timing/uncached-shared-core.json
            persian-timing/espeak-vowels.json
            persian-timing/espeak-alamat.json
          if-no-files-found: ignore
          retention-days: 7
