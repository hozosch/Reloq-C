name: Persian NVDA focused text probes
on:
  push:
    branches: [codex/persian-nvda-prep-20261115]
    paths:
      - experiments/persian/espeak_worker.c
      - experiments/persian/espeak_worker.py
      - experiments/persian/espeak_ng_probe.py
      - experiments/persian/test_espeak_worker.py
      - experiments/persian/reference_alignment.py
      - experiments/persian/test_reference_alignment.py
      - experiments/persian/text_frontend.py
      - experiments/persian/reference_espeak_1_51.jsonl
      - experiments/persian/direct_fa_*.c
      - experiments/persian/direct_fa_*.h
      - experiments/persian/direct_fa_*.inc
      - experiments/persian/test_direct_fa.c
      - experiments/persian/test_direct_fa_numbers.py
      - experiments/persian/reference_letter_names.py
      - experiments/persian/compile_direct_letters.py
      - experiments/persian/test_direct_fa_letters.py
      - experiments/persian/direct_fa_sequence.py
      - experiments/persian/test_direct_fa_sequence.py
      - nvda/_reloq_eci_direct.py
      - nvda/_reloq_persian_projection.py
      - experiments/persian/hybrid_fa_frontend.py
      - experiments/persian/test_hybrid_fa_frontend.py
      - include/reloq_utf8.h
      - src/reloq_utf8.c
      - .github/workflows/persian-nvda-text-probe.yml
permissions:
  contents: read
jobs:
  nvda-text:
    runs-on: windows-2022
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build isolated text worker
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -property installationPath
          if (!$vs) { throw 'Visual Studio C compiler was not found' }
          $envcmd = Join-Path $vs 'VC\Auxiliary\Build\vcvars64.bat'
          cmd.exe /d /c "`"$envcmd`" >nul && cl /nologo /O2 /W4 /std:c11 /Fe:fa-espeak-worker.exe experiments\persian\espeak_worker.c"
          if ($LASTEXITCODE -ne 0) { throw 'Text worker compilation failed' }
      - name: Build and test direct Persian C text components
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -property installationPath
          if (!$vs) { throw 'Visual Studio C compiler was not found' }
          $envcmd = Join-Path $vs 'VC\Auxiliary\Build\vcvars64.bat'
          cmd.exe /d /c "`"$envcmd`" >nul && cl /nologo /O2 /W4 /std:c11 /utf-8 /Iinclude /Fe:fa-direct-test.exe experiments\persian\test_direct_fa.c experiments\persian\direct_fa_lexicon.c experiments\persian\direct_fa_numbers.c experiments\persian\direct_fa_normalize.c experiments\persian\direct_fa_text.c experiments\persian\direct_fa_letters.c src\reloq_utf8.c"
          if ($LASTEXITCODE -ne 0) { throw 'Direct Persian components failed to compile' }
          .\fa-direct-test.exe
          if ($LASTEXITCODE -ne 0) { throw 'Direct Persian text smoke test failed' }
          cmd.exe /d /c "`"$envcmd`" >nul && cl /nologo /O2 /W4 /std:c11 /utf-8 /LD /Iinclude /Fe:fa-direct.dll experiments\persian\direct_fa_lexicon.c experiments\persian\direct_fa_numbers.c experiments\persian\direct_fa_normalize.c experiments\persian\direct_fa_text.c experiments\persian\direct_fa_letters.c src\reloq_utf8.c /link /EXPORT:reloq_fa_direct_text /EXPORT:reloq_fa_direct_number /EXPORT:reloq_fa_direct_letter /EXPORT:reloq_fa_direct_free"
          if ($LASTEXITCODE -ne 0) { throw 'Direct Persian DLL failed to compile' }
          python -B experiments/persian/test_direct_fa_sequence.py --native-library "$pwd/fa-direct.dll"
          if ($LASTEXITCODE -ne 0) { throw 'Persian source position projection failed' }
      - name: Obtain NVDA for its eSpeak library and data
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download release-2026.3.1 --repo nvaccess/nvda --pattern nvda_2026.3.1.exe --dir candidate
          if ($LASTEXITCODE -ne 0) { throw 'NVDA download failed' }
          if ((Get-FileHash candidate/nvda_2026.3.1.exe -Algorithm SHA256).Hash -ne '6F80A5B0CA720A7D0D314B5BE212F37388BBE81A1107AC3298C1821A1CD3F052') { throw 'Unexpected NVDA installer' }
          $portable = Join-Path $pwd 'portable-nvda'
          $p = Start-Process (Get-Item candidate/nvda_2026.3.1.exe).FullName -ArgumentList '--create-portable-silent', "--portable-path=$portable" -Wait -PassThru
          if ($p.ExitCode -ne 0 -or !(Test-Path "$portable/synthDrivers/espeak.dll")) { throw 'NVDA portable installation failed' }
      - name: Compare NVDA eSpeak analysis and cancellation
        shell: pwsh
        run: |
          $espeak = (Resolve-Path portable-nvda/synthDrivers/espeak.dll).Path
          $data = (Resolve-Path portable-nvda/synthDrivers).Path
          cmd.exe /d /c "fa-espeak-worker.exe `"$espeak`" `"$data`" < NUL"
          if ($LASTEXITCODE -ne 0) { throw 'Text worker could not initialize NVDA eSpeak' }
          python -B experiments/persian/test_espeak_worker.py --worker "$pwd/fa-espeak-worker.exe" --espeak-library "$espeak" --data-parent "$data"
          if ($LASTEXITCODE -ne 0) { throw 'NVDA eSpeak worker test failed' }
          python -B experiments/persian/test_direct_fa_numbers.py --native-library "$pwd/fa-direct.dll" --espeak-library "$espeak" --data-parent "$data"
          if ($LASTEXITCODE -ne 0) { throw 'Direct Persian number test failed' }
          python -B experiments/persian/test_hybrid_fa_frontend.py --native-library "$pwd/fa-direct.dll" --worker "$pwd/fa-espeak-worker.exe" --espeak-library "$espeak" --data-parent "$data"
          if ($LASTEXITCODE -ne 0) { throw 'Direct-first Persian frontend test failed' }
          python -B experiments/persian/test_reference_alignment.py --native-library "$pwd/fa-direct.dll" --worker "$pwd/fa-espeak-worker.exe" --espeak-library "$espeak" --data-parent "$data"
          if ($LASTEXITCODE -ne 0) { throw 'Persian reference word alignment failed' }
          python -B experiments/persian/test_direct_fa_letters.py --native-library "$pwd/fa-direct.dll" --worker "$pwd/fa-espeak-worker.exe" --espeak-library "$espeak" --data-parent "$data"
          if ($LASTEXITCODE -ne 0) { throw 'Persian letter names differ from NVDA eSpeak' }
