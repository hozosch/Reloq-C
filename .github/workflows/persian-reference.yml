name: Persian eSpeak Klatt reference
on:
  push:
    branches: [codex/persian-reference-20261113]
permissions:
  contents: read
jobs:
  reference:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Install eSpeak NG
        run: |
          if [ -f /etc/apt/apt-mirrors.txt ]; then sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|http://archive.ubuntu.com/ubuntu|g' /etc/apt/apt-mirrors.txt; fi
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 update -qq
          sudo apt-get -y --no-install-recommends install espeak-ng
      - name: Render default and Klatt voice references
        env:
          LC_ALL: C.UTF-8
        run: |
          set -euo pipefail
          mkdir -p reference
          espeak-ng --version | tee reference/version.txt
          for name in fa_iran fa_klatt_iran fa_klatt2_iran sv_jag sv_klatt_jag fa_klatt_statement fa_klatt_qalam; do
            case "$name" in
              fa_iran) lang=fa; text='ایران' ;;
              fa_klatt_iran) lang=fa+klatt; text='ایران' ;;
              fa_klatt2_iran) lang=fa+klatt2; text='ایران' ;;
              sv_jag) lang=sv; text='jag' ;;
              sv_klatt_jag) lang=sv+klatt; text='jag' ;;
              fa_klatt_statement) lang=fa+klatt; text='سلام دنیا.' ;;
              fa_klatt_qalam) lang=fa+klatt; text='قلم' ;;
            esac
            printf '%s [%s]: %s\n' "$name" "$lang" "$text" >> reference/phonemes.txt
            espeak-ng -v "$lang" -q --ipa=3 "$text" >> reference/phonemes.txt
            espeak-ng -v "$lang" -w "reference/$name.wav" "$text"
          done
          cat reference/phonemes.txt
      - uses: actions/upload-artifact@v4
        with:
          name: persian-espeak-klatt-reference
          path: reference/
          if-no-files-found: error
          retention-days: 7
