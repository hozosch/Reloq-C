name: Persian focused listening probe
on:
  push:
    branches: [codex/persian-timing-probe-20261114]
    paths:
      - experiments/persian/**
      - .github/workflows/persian-timing-probe.yml
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check private probe source preparation
        run: |
          python3 -m py_compile experiments/persian/build_native_probe.py experiments/persian/trace_word_edges_timing.py
          python3 experiments/persian/build_native_probe.py --dry-run
      - uses: actions/cache/restore@v4
        id: baseline
        with:
          path: |
            vendor/openevv61/build/release
            eci/build/posix
            eci/libreloq_eci.so
          key: persian-linux-gcc13-463c72658de0-v1
      - name: Build ordinary Linux core when needed
        if: steps.baseline.outputs.cache-hit != 'true'
        run: make -C eci -j2 libreloq_eci.so
      - uses: actions/cache/save@v4
        if: steps.baseline.outputs.cache-hit != 'true'
        with:
          path: |
            vendor/openevv61/build/release
            eci/build/posix
            eci/libreloq_eci.so
          key: persian-linux-gcc13-463c72658de0-v1
      - name: Install analysis dependencies
        run: python3 -m pip install numpy scipy
      - name: Build isolated acoustic probe
        run: python3 experiments/persian/build_native_probe.py --work-dir "$RUNNER_TEMP/fa" --jobs 2
      - name: Observe word boundaries and nucleus timings
        run: python3 experiments/persian/trace_word_edges_timing.py --library "$RUNNER_TEMP/fa/libreloq_eci.so"
      - name: Verify automatic L selection and isolation
        run: python3 experiments/persian/test_combined_l.py --baseline eci/libreloq_eci.so --probe "$RUNNER_TEMP/fa/libreloq_eci.so"
      - name: Install eSpeak NG for the comparison
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends espeak-ng
      - name: Render the narrated listening sample
        run: |
          python3 experiments/persian/espeak_reference.py --output "$RUNNER_TEMP/reference"
          python3 experiments/persian/compare_combined_l_timing.py --library "$RUNNER_TEMP/fa/libreloq_eci.so" --reference-dir "$RUNNER_TEMP/reference" --wav "out/persisch-l-vokallaenge.wav"
      - uses: actions/upload-artifact@v4
        with:
          name: persisch-l-vokallaenge
          path: out/persisch-l-vokallaenge.wav
          if-no-files-found: error
          retention-days: 14

# Reuse the ordinary Linux core; only the isolated test objects are rebuilt.
