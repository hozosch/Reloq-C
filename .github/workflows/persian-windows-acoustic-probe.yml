name: Persian Windows acoustic probe
on:
  workflow_dispatch:
  push:
    branches: [codex/persian-nvda-prep-20261115]
    paths:
      - experiments/persian/build_native_probe.py
      - experiments/persian/build_windows_probe.py
      - experiments/persian/scoped_acoustics_probe.c
      - experiments/persian/direct_fa_*.c
      - experiments/persian/direct_fa_*.h
      - experiments/persian/direct_fa_*.inc
      - experiments/persian/prepare_continuous_host.py
      - experiments/persian/continuous_frames.c
      - experiments/persian/continuous_frames.h
      - experiments/persian/continuous_replay.inc
      - experiments/persian/test_continuous_replay.py
      - experiments/persian/test_sibilant_noise.py
      - experiments/persian/test_embedded_text_rules.py
      - eci/test_persian_project.py
      - tests/test_reloq_classic_noise.c
      - nvda/_reloq_persian_frames.py
      - experiments/persian/test_windows_acoustics.py
      - .github/workflows/persian-windows-acoustic-probe.yml
permissions:
  contents: read
concurrency:
  group: persian-windows-acoustic-${{ github.ref }}
  cancel-in-progress: true
jobs:
  acoustic:
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/cache@v4
        id: provider
        with:
          path: vendor/openevv61/build/windows-release
          key: persian-windows-provider-gcc14-v1-${{ hashFiles('vendor/openevv61/**', 'include/**', 'src/reloq_voice_filter.c', 'src/reloq_orthography.c', 'src/reloq_german_word_edges.c', 'src/reloq_english_word_edges.c') }}
      - uses: actions/cache@v4
        id: host
        with:
          path: |
            eci/build/windows
            eci/eci.dll
          key: persian-windows-host-gcc14-v1-${{ hashFiles('eci/Makefile', 'eci/reloq_eci_fixed_math.c', 'src/**', 'include/**', 'vendor/openevv61/**', '!vendor/openevv61/build/**') }}
      - name: Restore cached provider timestamps
        if: steps.provider.outputs.cache-hit == 'true'
        shell: bash
        run: find vendor/openevv61/build/windows-release -type f -exec touch {} +
      - name: Restore cached host timestamps
        if: steps.host.outputs.cache-hit == 'true'
        shell: bash
        run: |
          find eci/build/windows -type f -exec touch {} +
          touch eci/eci.dll
      - name: Build the baseline Windows engine once
        shell: bash
        run: |
          export PATH="/c/mingw64/bin:/c/msys64/usr/bin:$PATH"
          make -C eci -j2 eci.dll SHELL=C:/msys64/usr/bin/bash.exe PROVIDER_LTO=-flto=2 WINDOWS_CC=gcc WINDOWS_OBJDUMP=objdump > windows-baseline-build.log 2>&1 || { tail -n 120 windows-baseline-build.log; exit 1; }
          python eci/verify_pe_exports.py eci/eci.dll --objdump objdump --header include/reloq_eci.h
          make -C eci eci_classic_noise_probe.exe SHELL=C:/msys64/usr/bin/bash.exe WINDOWS_CC=gcc WINDOWS_OBJDUMP=objdump
      - name: Build only the changed Persian provider objects
        shell: bash
        run: |
          export PATH="/c/mingw64/bin:/c/msys64/usr/bin:$PATH"
          python -B experiments/persian/build_windows_probe.py --work persian-windows-probe --jobs 2
      - name: Check scoped playback and isolation
        shell: pwsh
        run: |
          python -B experiments/persian/test_windows_acoustics.py --baseline eci/eci.dll --candidate persian-windows-probe/eci_persian_probe.dll
          if ($LASTEXITCODE -ne 0) { throw 'Windows Persian acoustic isolation failed' }
          & eci/eci_classic_noise_probe.exe
          if ($LASTEXITCODE -ne 0) { throw 'Windows high-rate sibilant spectrum test failed' }
          python -B experiments/persian/test_embedded_text_rules.py --library persian-windows-probe/eci_persian_probe.dll
          if ($LASTEXITCODE -ne 0) { throw 'Embedded Persian text rules are stale or missing' }
          python -B eci/test_persian_project.py --library persian-windows-probe/eci_persian_probe.dll
          if ($LASTEXITCODE -ne 0) { throw 'Native Persian text projection failed' }
          python -B experiments/persian/test_continuous_replay.py --probe persian-windows-probe/eci_persian_probe.dll
          if ($LASTEXITCODE -ne 0) { throw 'Windows continuous replay failed' }
          python -B experiments/persian/test_sibilant_noise.py --candidate persian-windows-probe/eci_persian_probe.dll
          if ($LASTEXITCODE -ne 0) { throw 'Persian sibilant targets failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: persian-windows-acoustic-probe
          path: |
            eci/eci.dll
            persian-windows-probe/eci_persian_probe.dll
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
