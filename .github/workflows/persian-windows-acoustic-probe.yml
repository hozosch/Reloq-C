permissions:
  contents: read
  actions: read
concurrency:
  group: persian-windows-acoustic-${{ github.ref }}
  cancel-in-progress: true
jobs:
  acoustic:
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check source-matched acoustic binaries
        id: reuse
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The previous run built both DLLs successfully but stopped at an
          # outdated text-test expectation. Reuse them only while every
          # binary input matches and the exact artifact is still available.
          reusable=false
          reuse_run=""
          if [ "$GITHUB_REF_NAME" = "codex/persian-finnish-nasal-swedish-20261120" ] &&
             git diff --quiet c1f884b21f409792f0987978aaa516cb9f114f94 HEAD -- \
               eci/Makefile eci/reloq_eci_fixed_math.c src include vendor/openevv61 \
               tools/prepare_persian_provider.py tools/reuse_persian_provider_cache.py \
               experiments/aragonese/build_native_probe.py experiments/persian/build_native_probe.py \
               experiments/persian/build_windows_probe.py experiments/persian/prepare_continuous_host.py \
               experiments/persian/continuous_frames.c experiments/persian/continuous_frames.h \
               experiments/persian/continuous_replay.inc experiments/persian/scoped_acoustics_probe.c \
               'experiments/persian/direct_fa_*.c' 'experiments/persian/direct_fa_*.h' \
               'experiments/persian/direct_fa_*.inc'; then
            id=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/44916929623/artifacts?per_page=100" \
              --jq '.artifacts[] | select(.id == 14712393088 and .expired == false and .digest == "sha256:8af4080dcc2ba10759ae6ae6d9438e566cf7142056bc4dcf18e076f2659f04c1" and .workflow_run.head_sha == "c1f884b21f409792f0987978aaa516cb9f114f94") | .id' || true)
            if [ "$id" = "14712393088" ]; then reusable=true; reuse_run=44916929623; fi
          fi
          # Reuse the fully tested predecessor's exact DLLs only when every
          # binary input still matches; all tests below run again at this head.
          if [ "$GITHUB_REF_NAME" = "codex/persian-native-u-20261121" ] &&
             git diff --quiet 8d4c340fcf745f89a2d76430131a31c7e3068c16 HEAD -- \
               eci/Makefile eci/reloq_eci_fixed_math.c src include vendor/openevv61 \
               tools/prepare_persian_provider.py tools/reuse_persian_provider_cache.py \
               experiments/aragonese/build_native_probe.py experiments/persian/build_native_probe.py \
               experiments/persian/build_windows_probe.py experiments/persian/prepare_continuous_host.py \
               experiments/persian/continuous_frames.c experiments/persian/continuous_frames.h \
               experiments/persian/continuous_replay.inc experiments/persian/scoped_acoustics_probe.c \
               'experiments/persian/direct_fa_*.c' 'experiments/persian/direct_fa_*.h' \
               'experiments/persian/direct_fa_*.inc'; then
            id=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/45044878820/artifacts?per_page=100" \
              --jq '.artifacts[] | select(.id == 14764040558 and .expired == false and .digest == "sha256:3bdd9fa766b75e0715fe1efd29a541d7019e659559edc67807cd8108d75d2914" and .workflow_run.head_sha == "8d4c340fcf745f89a2d76430131a31c7e3068c16") | .id' || true)
            if [ "$id" = "14764040558" ]; then reusable=true; reuse_run=45044878820; fi
          fi
          # The dev30 binaries were built successfully, but that run stopped
          # at an outdated H-to-Z test expectation. Reuse the exact verified
          # artifact only if every binary input still matches; all acoustic
          # and integration checks below are run again at the current head.
          if [ "$GITHUB_REF_NAME" = "codex/persian-native-u-20261121" ] &&
             git diff --quiet f37a5bd77409e8e1f943f1d9a8a4eb8a07704c52 HEAD -- \
               eci/Makefile eci/reloq_eci_fixed_math.c src include vendor/openevv61 \
               tools/prepare_persian_provider.py tools/reuse_persian_provider_cache.py \
               experiments/aragonese/build_native_probe.py experiments/persian/build_native_probe.py \
               experiments/persian/build_windows_probe.py experiments/persian/prepare_continuous_host.py \
               experiments/persian/continuous_frames.c experiments/persian/continuous_frames.h \
               experiments/persian/continuous_replay.inc experiments/persian/scoped_acoustics_probe.c \
               'experiments/persian/direct_fa_*.c' 'experiments/persian/direct_fa_*.h' \
               'experiments/persian/direct_fa_*.inc'; then
            id=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/45054672629/artifacts?per_page=100" \
              --jq '.artifacts[] | select(.id == 14767338404 and .expired == false and .digest == "sha256:a9f2ddf1dba4c382cc8709d6188cb89163842d8617c6cc035f60dc7d74c6185a" and .workflow_run.head_sha == "f37a5bd77409e8e1f943f1d9a8a4eb8a07704c52") | .id' || true)
            if [ "$id" = "14767338404" ]; then reusable=true; reuse_run=45054672629; fi
          fi
          echo "reusable=$reusable" >> "$GITHUB_OUTPUT"
          echo "run_id=$reuse_run" >> "$GITHUB_OUTPUT"
      - name: Reuse source-matched acoustic binaries
        if: steps.reuse.outputs.reusable == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          export PATH="/c/mingw64/bin:/c/msys64/usr/bin:$PATH"
          gh run download "${{ steps.reuse.outputs.run_id }}" --name persian-windows-acoustic-probe --dir reused-acoustic --repo "$GITHUB_REPOSITORY"
          mkdir -p persian-windows-probe
          cp reused-acoustic/eci/eci.dll eci/eci.dll
          cp reused-acoustic/persian-windows-probe/eci_persian_probe.dll persian-windows-probe/eci_persian_probe.dll
          python eci/verify_pe_exports.py eci/eci.dll --objdump objdump --header include/reloq_eci.h
          make -C eci eci_classic_noise_probe.exe SHELL=C:/msys64/usr/bin/bash.exe WINDOWS_CC=gcc WINDOWS_OBJDUMP=objdump
      - uses: actions/cache/restore@v6
        id: provider
        if: steps.reuse.outputs.reusable != 'true'
        with:
          path: vendor/openevv61/build/windows-release
          key: persian-windows-provider-gcc14-v2-${{ hashFiles('vendor/openevv61/**', 'include/**', 'src/reloq_voice_filter.c', 'src/reloq_orthography.c', 'src/reloq_german_word_edges.c', 'src/reloq_english_word_edges.c', 'src/reloq_persian_acoustics.c', 'src/reloq_persian_acoustics.h', 'tools/prepare_persian_provider.py', 'experiments/persian/build_native_probe.py', 'experiments/aragonese/build_native_probe.py') }}
          restore-keys: |
            persian-windows-provider-gcc14-v2-b79a57ae4c2ae97eeb8bf35dc23cb5bba40ffc28200ae396907ea7bf5fb53d39
            persian-windows-provider-gcc14-v2-5de40772759289fd47368c9f81b7a6276d78aba213423fcb60a098f9fd168b6a
            persian-windows-provider-gcc14-v2-ca576de950b66d8fbb873c89445a60993dddf2e0528e6da62ba39ba5d4d46999
            persian-windows-provider-gcc14-v2-4e6e2b0efe6a150a1ede3b8f1dd19922f4c0fedb3f31dbb2b9e705c3c4004460
            persian-windows-provider-gcc14-v2-7c9a787e05fed4238c0f7780436689064c7eb6ee6ae6ab9082cf81231a9a109b
            persian-windows-provider-gcc14-v2-4edfcf5f09f279de3e60241a807f6da8ee0269a801e9ce9fa6db6de9eba9a7ea
            persian-windows-provider-gcc14-v2-02eff3929fd30e8fdebed50f38e28587951afe693dc8f0aa800f0512c3cf5f6b
            persian-windows-provider-gcc14-v2-782694288976480b757bf5220770ab738c651bf3e9222a0c071b2a7198289a63
            persian-windows-provider-gcc14-v2-04cc9a755afeb7ef13a3aebfa7900e2fcef9ceaa6dec69c8d88257a01ecfdbac
      - uses: actions/cache/restore@v6
        id: host
        if: steps.reuse.outputs.reusable != 'true'
        with:
          path: |
            eci/build/windows
            eci/eci.dll
          key: persian-windows-host-gcc14-v2-${{ hashFiles('eci/Makefile', 'eci/reloq_eci_fixed_math.c', 'src/**', 'include/**', 'vendor/openevv61/**', '!vendor/openevv61/build/**', 'experiments/persian/direct_fa_*.c', 'experiments/persian/direct_fa_*.h', 'experiments/persian/direct_fa_*.inc', 'tools/prepare_persian_provider.py', 'experiments/persian/build_native_probe.py', 'experiments/aragonese/build_native_probe.py') }}
          restore-keys: |
            persian-windows-host-gcc14-v2-89fe1c68ffc01ee0d0c40f0061a3fe4ac3dee2197657891dc14ab8919c009156
            persian-windows-host-gcc14-v2-550359d015dcee8e8741f8de1460dec5bf725f325c3b4c9e33a8e6ae8e1f5d28
            persian-windows-host-gcc14-v2-30af170397101f659f29a2a315d16d726eed79098ece67bb74e5777179854068
            persian-windows-host-gcc14-v2-6b9045ffe6990b76462ff5f1ea0cf5d0bb5cd710bd3ace2736572bc0c782affe
            persian-windows-host-gcc14-v2-bdc1db30fb89d5b74756a0a4004095d3e1fd78de1a2d1b522df02f1f05c17c9c
            persian-windows-host-gcc14-v2-768d67b0405a722cb2963006a93c4bd82098b60f54ead2434822d7703f7cf858
            persian-windows-host-gcc14-v2-c9271a83e4aa463ba48644fd5727688aa3ce3fbf6b4452a211f99357010d4eb7
            persian-windows-host-gcc14-v2-32260b50bc1d953680e539a8182b9a61260f2c7d5f7b4c09c02a681570c1c7ff
            persian-windows-host-gcc14-v2-919f203ba3281c47932aaa750f203a5cbbd8aeae140bfc7e107dc0c43482f76a
            persian-windows-host-gcc14-v2-315d8e6213d9a22ae30b229094495b3f50d0b93bed882604fc4a2b5cab13b216
      - name: Restore cached provider timestamps
        if: steps.reuse.outputs.reusable != 'true' && steps.provider.outputs.cache-hit == 'true'
        shell: bash
        run: find vendor/openevv61/build/windows-release -type f -exec touch {} +
      - name: Reuse compatible provider objects
        if: steps.reuse.outputs.reusable != 'true' && steps.provider.outputs.cache-hit != 'true'
        shell: bash
        env:
          PERSIAN_PROVIDER_CACHE_KEY: ${{ steps.provider.outputs.cache-matched-key }}
        run: python -B tools/reuse_persian_provider_cache.py
      - name: Verify provider cache safeguards
        shell: pwsh
        run: |
          python -B tests/test_persian_provider_cache.py
          if ($LASTEXITCODE -ne 0) { throw 'Provider cache safeguards failed' }
      - name: Check overlapping phone clocks
        shell: bash
        run: |
          export PATH="/c/mingw64/bin:/c/msys64/usr/bin:$PATH"
          gcc -std=c11 -Wall -Wextra -Werror -Iinclude tests/test_reloq_trace_clock.c -o trace-clock.exe
          ./trace-clock.exe
      - name: Restore cached host timestamps
        if: steps.reuse.outputs.reusable != 'true' && steps.host.outputs.cache-hit == 'true'
        shell: bash
        run: |
          find eci/build/windows -type f -exec touch {} +
          touch eci/eci.dll
      - name: Reuse compatible host objects
        if: steps.reuse.outputs.reusable != 'true' && steps.host.outputs.cache-hit != 'true' && steps.host.outputs.cache-matched-key != ''
        shell: pwsh
        env:
          PERSIAN_HOST_CACHE_KEY: ${{ steps.host.outputs.cache-matched-key }}
        run: |
          python -B tests/test_persian_host_cache.py
          if ($LASTEXITCODE -ne 0) { throw 'Host cache safeguards failed' }
          python -B tools/reuse_persian_host_cache.py
          if ($LASTEXITCODE -ne 0) { throw 'Host cache preparation failed' }
      - name: Build the baseline Windows engine once
        if: steps.reuse.outputs.reusable != 'true'
        shell: bash
        run: |
          export PATH="/c/mingw64/bin:/c/msys64/usr/bin:$PATH"
          make -C eci -j2 eci.dll SHELL=C:/msys64/usr/bin/bash.exe PROVIDER_LTO=-flto=2 WINDOWS_CC=gcc WINDOWS_OBJDUMP=objdump > windows-baseline-build.log 2>&1 || { tail -n 120 windows-baseline-build.log; exit 1; }
          python eci/verify_pe_exports.py eci/eci.dll --objdump objdump --header include/reloq_eci.h
          make -C eci eci_classic_noise_probe.exe SHELL=C:/msys64/usr/bin/bash.exe WINDOWS_CC=gcc WINDOWS_OBJDUMP=objdump
      - name: Check concurrent voice initialization
        shell: pwsh
        env:
          RELOQ_RULE_DEBUG: '1'
        run: |
          python -B eci/test_concurrent_startup.py --library eci/eci.dll --rounds 40
          if ($LASTEXITCODE -ne 0) { throw 'Concurrent cold multilingual voice initialization failed' }
      - uses: actions/upload-artifact@v7
        with:
          name: persian-windows-baseline-early
          path: eci/eci.dll
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - name: Build the diagnostic DLL from the shared provider
        if: steps.reuse.outputs.reusable != 'true'
        shell: bash
        run: |
          export PATH="/c/mingw64/bin:/c/msys64/usr/bin:$PATH"
          python -B experiments/persian/build_windows_probe.py --work persian-windows-probe --jobs 2 --use-shared-provider
      - name: Check scoped playback and isolation
        shell: pwsh
        run: |
          python -B experiments/persian/test_windows_acoustics.py --baseline eci/eci.dll --candidate persian-windows-probe/eci_persian_probe.dll
          if ($LASTEXITCODE -ne 0) { throw 'Windows Persian acoustic isolation failed' }
          python -B eci/test_persian_acoustics.py --library eci/eci.dll --reference persian-windows-probe/eci_persian_probe.dll
          if ($LASTEXITCODE -ne 0) { throw 'Shared Windows provider does not match the accepted Persian acoustics' }
          & eci/eci_classic_noise_probe.exe
          if ($LASTEXITCODE -ne 0) { throw 'Windows high-rate sibilant spectrum test failed' }
