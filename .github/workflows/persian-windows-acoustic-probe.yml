name: Persian Windows acoustic probe
on:
  workflow_dispatch:
  push:
    branches: [codex/persian-nvda-prep-20261115, codex/persian-clarity-20261116, codex/persian-issue49-followup-20261117, codex/persian-vowels-20261117, codex/persian-us-contour-20261117, codex/persian-adjectives-20261117, codex/persian-ra-pinglish-20261119, codex/persian-core-20261119, codex/persian-phones-20261119, codex/persian-native-20261120, codex/persian-issue49-solh-20261120, codex/persian-native-transitions-20261120, codex/persian-native-fast-pilot-20261120, codex/persian-sentence-core-20261120, codex/persian-sentence-linear-20261120, codex/persian-context-native-20261120, codex/persian-transition-streaming-20261120, codex/persian-native-sv-probe-20261120]
    paths:
      - experiments/persian/build_native_probe.py
      - experiments/persian/build_windows_probe.py
      - experiments/persian/scoped_acoustics_probe.c
      - tools/prepare_persian_provider.py
      - tools/reuse_persian_provider_cache.py
      - src/reloq_persian_acoustics.c
      - src/reloq_noise_profile.c
      - src/reloq_persian_acoustics.h
      - src/reloq_persian_frames.c
      - src/reloq_persian_phones.c
      - src/reloq_persian_pinglish_phrase.c
      - src/reloq_persian_glides.c
      - src/reloq_persian_prosody.c
      - src/reloq_persian_transition.c
      - src/reloq_persian_transition.h
      - src/reloq_persian_plan.c
      - include/reloq_persian_timing.h
      - experiments/persian/test_native_us_word_contour.py
      - experiments/persian/test_persian_final_h_after_consonant.py
      - experiments/persian/test_fa_stress_policy.py
      - nvda/test_eci_english_currency_case.py
      - src/reloq_english_currency.h
      - experiments/persian/test_persian_worker_reuse.py
      - src/reloq_persian_frame_internal.h
      - src/reloq_eci.c
      - src/reloq_rules61.c
      - src/reloq_unicode.c
      - src/reloq_unicode_official.inc
      - include/reloq_unicode.h
      - src/reloq_persian_direct.h
      - include/reloq_eci.h
      - include/reloq_persian_frames.h
      - include/reloq_persian_tuning.h
      - include/reloq_syllable_trace.h
      - include/reloq_persian_numbers.h
      - include/reloq_persian_phones.h
      - experiments/persian/test_persian_phone_inventory.py
      - experiments/persian/test_persian_phone_audio.py
      - experiments/persian/test_native_persian_glides.py
      - experiments/persian/test_persian_number_events.py
      - experiments/persian/test_persian_hundred.py
      - experiments/persian/test_persian_h_after_l.py
      - experiments/persian/test_persian_voiced_stop_h.py
      - experiments/persian/test_fa_orthography.py
      - experiments/persian/test_fa_morphology.py
      - vendor/openevv61/Makefile.native
      - eci/Makefile
      - eci/test_persian_acoustics.py
      - eci/test_concurrent_startup.py
      - tests/test_low_arena_concurrent.c
      - vendor/openevv61/src/port/evv_arena.c
      - vendor/openevv61/src/port/port_win32.c
      - vendor/openevv61/src/delta/delta_low.c
      - vendor/openevv61/src/eci/lang/eci_voicetable.c
      - vendor/openevv61/src/eci/api/eci_dllobj.c
      - vendor/openevv61/src/reloq61_bridge.c
      - vendor/openevv61/lang/fifi/delta_rules_c13_fifi.c
      - vendor/openevv61/lang/dede61/delta_rules_c24_dede61.c
      - vendor/openevv61/lang/enus61/delta_rules_c31_enus61.c
      - vendor/openevv61/lang/jajp61/delta_rules_c25_jajp61.c
      - vendor/openevv61/lang/fifi/delta_rules_c30_fifi.c
      - vendor/openevv61/lang/enus61/delta_rules_c29_enus61.c
      - vendor/openevv61/lang/jajp61/delta_rules_c17_jajp61.c
      - vendor/openevv61/lang/jajp61/delta_rules_c30_jajp61.c
      - experiments/persian/direct_fa_*.c
      - experiments/persian/direct_fa_*.h
      - experiments/persian/direct_fa_*.inc
      - experiments/persian/prepare_continuous_host.py
      - experiments/persian/continuous_frames.c
      - experiments/persian/continuous_frames.h
      - experiments/persian/continuous_replay.inc
      - experiments/persian/test_continuous_replay.py
      - experiments/persian/test_sibilant_noise.py
      - experiments/persian/test_mixed_pitch_edges.py
      - experiments/persian/build_a_nasal_comparison.py
      - experiments/persian/test_a_nasal_comparison.py
      - experiments/persian/test_us_articulation.py
      - experiments/persian/test_us_consonants.py
      - experiments/persian/test_us_nasals.py
      - experiments/persian/test_open_vowels.py
      - experiments/persian/test_yek_duration.py
      - experiments/persian/test_glide_e_reference.py
      - experiments/persian/test_persian_r.py
      - experiments/persian/test_persian_r_after_i.py
      - experiments/persian/test_persian_r_after_i_contexts.py
      - experiments/persian/test_bakhtiari_football.py
      - experiments/persian/test_initial_vowel_timing.py
      - experiments/persian/test_persian_vowel_hiatus.py
      - experiments/persian/test_persian_a_hiatus.py
      - experiments/persian/test_r_metallic_edge.py
      - experiments/persian/test_persian_final_r_connected.py
      - experiments/persian/test_persian_r_liaison.py
      - experiments/persian/test_persian_u_and_before_i.py
      - experiments/persian/test_persian_u_source.py
      - experiments/persian/test_female_small_head_whistle.py
      - experiments/persian/test_japanese_nasal_aspiration.py
      - experiments/persian/test_british_front_a.py
      - experiments/persian/test_front_a_harmonics.py
      - experiments/persian/test_german_vowel_blend.py
      - tests/test_persian_provider_cache.py
      - tests/test_persian_host_cache.py
      - tools/reuse_persian_host_cache.py
      - experiments/persian/test_embedded_text_rules.py
      - eci/test_persian_project.py
      - eci/test_persian_frames.py
      - tests/test_reloq_classic_noise.c
      - nvda/_reloq_persian_frames.py
      - experiments/persian/test_windows_acoustics.py
      - .github/workflows/persian-windows-acoustic-probe.yml
permissions:
  contents: read
concurrency:
  group: persian-windows-acoustic-${{ github.ref }}
  cancel-in-progress: true
jobs:
  acoustic:
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/cache/restore@v4
        id: provider
        with:
          path: vendor/openevv61/build/windows-release
          key: persian-windows-provider-gcc14-v2-${{ hashFiles('vendor/openevv61/**', 'include/**', 'src/reloq_voice_filter.c', 'src/reloq_orthography.c', 'src/reloq_german_word_edges.c', 'src/reloq_english_word_edges.c', 'src/reloq_persian_acoustics.c', 'src/reloq_persian_acoustics.h', 'tools/prepare_persian_provider.py', 'experiments/persian/build_native_probe.py', 'experiments/aragonese/build_native_probe.py') }}
          restore-keys: |
            persian-windows-provider-gcc14-v2-4edfcf5f09f279de3e60241a807f6da8ee0269a801e9ce9fa6db6de9eba9a7ea
            persian-windows-provider-gcc14-v2-02eff3929fd30e8fdebed50f38e28587951afe693dc8f0aa800f0512c3cf5f6b
            persian-windows-provider-gcc14-v2-782694288976480b757bf5220770ab738c651bf3e9222a0c071b2a7198289a63
            persian-windows-provider-gcc14-v2-04cc9a755afeb7ef13a3aebfa7900e2fcef9ceaa6dec69c8d88257a01ecfdbac
            persian-windows-provider-gcc14-v2-0c10a06526b641297356b228a95a40bad91c9e8b9b7e613eed1188ac96286aa9
            persian-windows-provider-gcc14-v2-f67c1d2ffe98915df1e66caa287666526b8a4547bbb0dd70135ef814bfb61d72
            persian-windows-provider-gcc14-v2-108f6310f0a376348d7bac35eaebf7a872b82a8ec8f60f00a8908c506f022e55
            persian-windows-provider-gcc14-v2-cc24acb2a55e9cfd8247aa179c9d4431deee377eebc2ae9bc72e3e96d58ae3cd
            persian-windows-provider-gcc14-v2-be6164f9e92b715a8bcc78fec5fb2876c51a1bbf469da873cee700a850c9d9b9
      - uses: actions/cache/restore@v4
        id: host
        with:
          path: |
            eci/build/windows
            eci/eci.dll
          key: persian-windows-host-gcc14-v2-${{ hashFiles('eci/Makefile', 'eci/reloq_eci_fixed_math.c', 'src/**', 'include/**', 'vendor/openevv61/**', '!vendor/openevv61/build/**', 'experiments/persian/direct_fa_*.c', 'experiments/persian/direct_fa_*.h', 'experiments/persian/direct_fa_*.inc', 'tools/prepare_persian_provider.py', 'experiments/persian/build_native_probe.py', 'experiments/aragonese/build_native_probe.py') }}
          restore-keys: |
            persian-windows-host-gcc14-v2-014d42330379aa1315919614c79f41876d34c8d4eab6aeea8bc6b7ea194c949d
            persian-windows-host-gcc14-v2-12776d4d080ba6a3260e7a39aaf0c5364959c7e8e909bbb50ba87280ed821ef7
            persian-windows-host-gcc14-v2-7b91c4f5a30718c9fd1a3be2b4303da45bcb92864cdb940c236ce3f8f7a6e6b9
            persian-windows-host-gcc14-v2-268ffbca07ccee73cc8031e3e92a2c32769e571c090464467f75ceef0bd2da09
            persian-windows-host-gcc14-v2-2d28d855a417923c98c03817e565440186fb9c17a0d6508a945bb3d8b3be9fc5
            persian-windows-host-gcc14-v2-278f51539cb847a4e95abe4bc1fc20ee9a8d0949090162e7ede927b0fa2834ba
            persian-windows-host-gcc14-v2-de500316e8c7bfea087b7eb9bdd6965ce21ea030dfedbb4def6c30f111d52d42
            persian-windows-host-gcc14-v2-64655db88d9d2921c335cc3fce13b44126d168864cfffa3fc0b453bfc582b492
            persian-windows-host-gcc14-v2-dc698865629915348179f0cd6d7ee667fb27457cb4aba0a9f3961eb660d5d42b
      - name: Restore cached provider timestamps
        if: steps.provider.outputs.cache-hit == 'true'
        shell: bash
        run: find vendor/openevv61/build/windows-release -type f -exec touch {} +
      - name: Reuse compatible provider objects
        if: steps.provider.outputs.cache-hit != 'true'
        shell: bash
        env:
          PERSIAN_PROVIDER_CACHE_KEY: ${{ steps.provider.outputs.cache-matched-key }}
        run: python -B tools/reuse_persian_provider_cache.py
      - name: Verify provider cache safeguards
        shell: pwsh
        run: |
          python -B tests/test_persian_provider_cache.py
          if ($LASTEXITCODE -ne 0) { throw 'Provider cache safeguards failed' }
      - name: Restore cached host timestamps
        if: steps.host.outputs.cache-hit == 'true'
        shell: bash
        run: |
          find eci/build/windows -type f -exec touch {} +
          touch eci/eci.dll
      - name: Reuse compatible host objects
        if: steps.host.outputs.cache-hit != 'true' && steps.host.outputs.cache-matched-key != ''
        shell: pwsh
        env:
          PERSIAN_HOST_CACHE_KEY: ${{ steps.host.outputs.cache-matched-key }}
        run: |
          python -B tests/test_persian_host_cache.py
          if ($LASTEXITCODE -ne 0) { throw 'Host cache safeguards failed' }
          python -B tools/reuse_persian_host_cache.py
          if ($LASTEXITCODE -ne 0) { throw 'Host cache preparation failed' }
      - name: Build the baseline Windows engine once
        shell: bash
        run: |
          export PATH="/c/mingw64/bin:/c/msys64/usr/bin:$PATH"
          make -C eci -j2 eci.dll SHELL=C:/msys64/usr/bin/bash.exe PROVIDER_LTO=-flto=2 WINDOWS_CC=gcc WINDOWS_OBJDUMP=objdump > windows-baseline-build.log 2>&1 || { tail -n 120 windows-baseline-build.log; exit 1; }
          python eci/verify_pe_exports.py eci/eci.dll --objdump objdump --header include/reloq_eci.h
          make -C eci eci_classic_noise_probe.exe SHELL=C:/msys64/usr/bin/bash.exe WINDOWS_CC=gcc WINDOWS_OBJDUMP=objdump
      - name: Check concurrent voice initialization
        shell: pwsh
        env:
          RELOQ_RULE_DEBUG: '1'
        run: |
          python -B eci/test_concurrent_startup.py --library eci/eci.dll --rounds 40
          if ($LASTEXITCODE -ne 0) { throw 'Concurrent cold multilingual voice initialization failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: persian-windows-baseline-early
          path: eci/eci.dll
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - name: Build the diagnostic DLL from the shared provider
        shell: bash
        run: |
          export PATH="/c/mingw64/bin:/c/msys64/usr/bin:$PATH"
          python -B experiments/persian/build_windows_probe.py --work persian-windows-probe --jobs 2 --use-shared-provider
      - name: Check scoped playback and isolation
        shell: pwsh
        run: |
          python -B experiments/persian/test_windows_acoustics.py --baseline eci/eci.dll --candidate persian-windows-probe/eci_persian_probe.dll
          if ($LASTEXITCODE -ne 0) { throw 'Windows Persian acoustic isolation failed' }
          python -B eci/test_persian_acoustics.py --library eci/eci.dll --reference persian-windows-probe/eci_persian_probe.dll
          if ($LASTEXITCODE -ne 0) { throw 'Shared Windows provider does not match the accepted Persian acoustics' }
          & eci/eci_classic_noise_probe.exe
          if ($LASTEXITCODE -ne 0) { throw 'Windows high-rate sibilant spectrum test failed' }
          python -B experiments/persian/test_embedded_text_rules.py --library persian-windows-probe/eci_persian_probe.dll
          if ($LASTEXITCODE -ne 0) { throw 'Embedded Persian text rules are stale or missing' }
          python -B eci/test_persian_project.py --library persian-windows-probe/eci_persian_probe.dll
          if ($LASTEXITCODE -ne 0) { throw 'Native Persian text projection failed' }
          python -B eci/test_persian_frames.py --library eci/eci.dll --standard
          if ($LASTEXITCODE -ne 0) { throw 'Common ECI frame capture or replay failed' }
          python -B experiments/persian/test_persian_phone_inventory.py --library eci/eci.dll
          if ($LASTEXITCODE -ne 0) { throw 'Persian phone inventory or its existing sound bridge failed' }
          python -B experiments/persian/test_persian_phone_audio.py --candidate eci/eci.dll
          if ($LASTEXITCODE -ne 0) { throw 'Persian phonetic characters changed their audio' }
          python -B experiments/persian/test_native_persian_glides.py --library eci/eci.dll
          if ($LASTEXITCODE -ne 0) { throw 'Native Persian glide differs from the accepted planner' }
          python -B experiments/persian/test_fa_morphology.py --library eci/eci.dll
          if ($LASTEXITCODE -ne 0) { throw 'Persian morphology and stress failed' }
          python -B experiments/persian/test_persian_hundred.py --library eci/eci.dll
          if ($LASTEXITCODE -ne 0) { throw 'Persian hundred-group timing failed' }
          python -B experiments/persian/test_persian_h_after_l.py --library eci/eci.dll
          if ($LASTEXITCODE -ne 0) { throw 'Persian h after l is not audible' }
          python -B experiments/persian/test_persian_voiced_stop_h.py --library eci/eci.dll
          if ($LASTEXITCODE -ne 0) { throw 'Persian vowel-D-H transition failed' }
          python -B experiments/persian/test_persian_final_h_after_consonant.py --library eci/eci.dll
          if ($LASTEXITCODE -ne 0) { throw 'Persian final h impulse failed' }
          python -B experiments/persian/test_fa_stress_policy.py --library eci/eci.dll
          if ($LASTEXITCODE -ne 0) { throw 'Persian stress policy failed' }
          python -B nvda/test_eci_english_currency_case.py --library eci/eci.dll
          if ($LASTEXITCODE -ne 0) { throw 'English currency magnitude failed' }
          python -B experiments/persian/test_native_us_word_contour.py --library eci/eci.dll
          if ($LASTEXITCODE -ne 0) { throw 'Native Persian US contour differed from the established planner' }
          python -B experiments/persian/test_persian_worker_reuse.py --library eci/eci.dll
          if ($LASTEXITCODE -ne 0) { throw 'Persian provider reuse isolation failed' }
          python -B experiments/persian/test_persian_r_after_i_contexts.py --library eci/eci.dll
          if ($LASTEXITCODE -ne 0) { throw 'Persian medial r after i failed' }
          python -B experiments/persian/test_bakhtiari_football.py --library eci/eci.dll
          if ($LASTEXITCODE -ne 0) { throw 'Persian Bakhtiari or football acoustics failed' }
          python -B experiments/persian/test_initial_vowel_timing.py --library eci/eci.dll
          if ($LASTEXITCODE -ne 0) { throw 'Persian first-vowel timing failed' }
          python -B experiments/persian/test_persian_vowel_hiatus.py --library eci/eci.dll
          if ($LASTEXITCODE -ne 0) { throw 'Persian unstressed hiatus timing failed' }
          python -B experiments/persian/test_persian_a_hiatus.py --library eci/eci.dll
          if ($LASTEXITCODE -ne 0) { throw 'Persian weak-A hiatus timing failed' }
          python -B experiments/persian/test_r_metallic_edge.py --library eci/eci.dll
          if ($LASTEXITCODE -ne 0) { throw 'Persian metallic R transition failed' }
          python -B experiments/persian/test_mixed_pitch_edges.py --library eci/eci.dll
          if ($LASTEXITCODE -ne 0) { throw 'English pitch preservation failed' }
          python -B experiments/persian/test_us_articulation.py --candidate eci/eci.dll
          if ($LASTEXITCODE -ne 0) { throw 'Persian vowel or articulation candidate failed' }
          python -B experiments/persian/test_us_consonants.py --candidate eci/eci.dll
          if ($LASTEXITCODE -ne 0) { throw 'US consonant, affricate or aspiration alignment failed' }
          python -B experiments/persian/test_us_nasals.py --candidate eci/eci.dll
          if ($LASTEXITCODE -ne 0) { throw 'US nasal alignment failed' }
          python -B experiments/persian/test_open_vowels.py --candidate eci/eci.dll
          if ($LASTEXITCODE -ne 0) { throw 'Persian short vowel shaping failed' }
          python -B experiments/persian/test_yek_duration.py --candidate eci/eci.dll
          if ($LASTEXITCODE -ne 0) { throw 'Persian yek timing failed' }
          python -B experiments/persian/test_glide_e_reference.py --candidate eci/eci.dll
          if ($LASTEXITCODE -ne 0) { throw 'Persian glide or reference E failed' }
          python -B experiments/persian/test_persian_r.py --candidate eci/eci.dll
          if ($LASTEXITCODE -ne 0) { throw 'Persian R, vowel isolation or Brazilian final R failed' }
          python -B experiments/persian/test_persian_r_after_i.py --candidate eci/eci.dll
          if ($LASTEXITCODE -ne 0) { throw 'Persian R after I or before O failed' }
          python -B experiments/persian/test_persian_final_r_connected.py --candidate eci/eci.dll
          if ($LASTEXITCODE -ne 0) { throw 'Connected Persian word-final R failed' }
          python -B experiments/persian/test_persian_r_liaison.py --candidate eci/eci.dll
          if ($LASTEXITCODE -ne 0) { throw 'Persian R liaison or post-consonant R failed' }
          python -B experiments/persian/test_persian_u_and_before_i.py --candidate eci/eci.dll
          if ($LASTEXITCODE -ne 0) { throw 'Persian German-U or R-before-I comparison failed' }
          python -B experiments/persian/test_persian_u_source.py --candidate eci/eci.dll
          if ($LASTEXITCODE -ne 0) { throw 'Persian German-U source or female-voice comparison failed' }
          python -B experiments/persian/test_female_small_head_whistle.py --candidate eci/eci.dll
          if ($LASTEXITCODE -ne 0) { throw 'Small-head German or Japanese sibilant whistle failed' }
          python -B experiments/persian/test_japanese_nasal_aspiration.py --candidate eci/eci.dll
          if ($LASTEXITCODE -ne 0) { throw 'Japanese nasal aspiration or H preservation failed' }
          python -B experiments/persian/test_british_front_a.py --candidate eci/eci.dll
          if ($LASTEXITCODE -ne 0) { throw 'British/Persian front-vowel comparison failed' }
          python -B experiments/persian/test_front_a_harmonics.py --candidate eci/eci.dll
          if ($LASTEXITCODE -ne 0) { throw 'Persian front-vowel harmonic comparison failed' }
          python -B experiments/persian/test_german_vowel_blend.py --candidate eci/eci.dll
          if ($LASTEXITCODE -ne 0) { throw 'German-guided Persian vowel comparison failed' }
          python -B eci/test_persian_frames.py --library persian-windows-probe/eci_persian_probe.dll
          if ($LASTEXITCODE -ne 0) { throw 'Persian probe frame capture or replay failed' }
          python -B experiments/persian/test_continuous_replay.py --probe persian-windows-probe/eci_persian_probe.dll
          if ($LASTEXITCODE -ne 0) { throw 'Windows continuous replay failed' }
          python -B experiments/persian/test_sibilant_noise.py --candidate persian-windows-probe/eci_persian_probe.dll
          if ($LASTEXITCODE -ne 0) { throw 'Persian sibilant targets failed' }
      - uses: actions/cache/save@v4
        if: steps.host.outputs.cache-hit != 'true'
        with:
          path: |
            eci/build/windows
            eci/eci.dll
          key: ${{ steps.host.outputs.cache-primary-key }}
      - uses: actions/cache/save@v4
        if: success() && steps.provider.outputs.cache-hit != 'true'
        with:
          path: vendor/openevv61/build/windows-release
          key: ${{ steps.provider.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: persian-windows-acoustic-probe
          path: |
            eci/eci.dll
            persian-windows-probe/eci_persian_probe.dll
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
