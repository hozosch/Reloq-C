name: Persian Windows acoustic retest
on:
  workflow_dispatch:
  push:
    branches: [codex/persian-adjectives-20261117]
    paths:
      - .github/workflows/persian-windows-acoustic-retest.yml
      - experiments/persian/test_persian_r.py
permissions:
  contents: read
  actions: read
jobs:
  retest:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select an identical completed native build
        id: source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A previous run may have completed after a test-harness error.
          # Reuse its DLL only when all acoustic and build inputs are equal;
          # the separate retest must still execute the missing checks.
          gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/persian-windows-acoustic-probe.yml/runs" -f branch="$GITHUB_REF_NAME" -F per_page=40 --jq '.workflow_runs[] | select(.status == "completed") | "\(.id) \(.head_sha)"' > acoustic-runs.txt
          selected=""
          while read -r run sha; do
            if ! git diff --quiet "$sha" HEAD -- \
                eci/Makefile src include vendor/openevv61 \
                tools/prepare_persian_provider.py tools/reuse_persian_provider_cache.py \
                experiments/aragonese/build_native_probe.py experiments/persian/build_native_probe.py \
                experiments/persian/build_windows_probe.py experiments/persian/prepare_continuous_host.py \
                experiments/persian/continuous_frames.c experiments/persian/continuous_frames.h \
                experiments/persian/continuous_replay.inc experiments/persian/scoped_acoustics_probe.c \
                experiments/persian/test_embedded_text_rules.py eci/test_persian_project.py \
                eci/test_persian_frames.py eci/test_persian_acoustics.py eci/test_concurrent_startup.py \
                tests/test_low_arena_concurrent.c tests/test_reloq_classic_noise.c \
                'experiments/persian/direct_fa_*.c' 'experiments/persian/direct_fa_*.h' \
                'experiments/persian/direct_fa_*.inc' .github/workflows/persian-windows-acoustic-probe.yml; then
              continue
            fi
            artifact=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run/artifacts?per_page=100" --jq '.artifacts[] | select(.name == "persian-windows-acoustic-probe" and .expired == false) | .id')
            if [ -n "$artifact" ]; then selected="$run"; break; fi
          done < acoustic-runs.txt
          if [ -z "$selected" ]; then echo 'No matching native acoustic artifact' >&2; exit 1; fi
          echo "run_id=$selected" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          name: persian-windows-acoustic-probe
          run-id: ${{ steps.source.outputs.run_id }}
          github-token: ${{ github.token }}
          path: candidate
      - name: Test R, neighboring vowels and remaining acoustic cases
        shell: pwsh
        run: |
          $native = 'candidate/eci/eci.dll'
          $probe = 'candidate/persian-windows-probe/eci_persian_probe.dll'
          python -B experiments/persian/test_persian_r.py --candidate $native
          if ($LASTEXITCODE -ne 0) { throw 'Persian R failed' }
          python -B experiments/persian/test_japanese_nasal_aspiration.py --candidate $native
          if ($LASTEXITCODE -ne 0) { throw 'Japanese nasal failed' }
          python -B experiments/persian/test_british_front_a.py --candidate $native
          if ($LASTEXITCODE -ne 0) { throw 'Persian front vowel failed' }
          python -B experiments/persian/test_front_a_harmonics.py --candidate $native
          if ($LASTEXITCODE -ne 0) { throw 'Persian vowel harmonics failed' }
          python -B experiments/persian/test_german_vowel_blend.py --candidate $native
          if ($LASTEXITCODE -ne 0) { throw 'German-guided Persian vowel failed' }
          python -B eci/test_persian_frames.py --library $probe
          if ($LASTEXITCODE -ne 0) { throw 'Persian frame replay failed' }
          python -B experiments/persian/test_continuous_replay.py --probe $probe
          if ($LASTEXITCODE -ne 0) { throw 'Continuous replay failed' }
          python -B experiments/persian/test_sibilant_noise.py --candidate $probe
          if ($LASTEXITCODE -ne 0) { throw 'Persian sibilant failed' }
