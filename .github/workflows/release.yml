name: Publish verified installable packages
on:
  push:
    branches: [main]
    paths: [.github/release.json]
permissions:
  contents: read
  actions: read
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Read candidate run
        id: candidate
        run: |
          python3 - <<'PY'
          import json, os
          request = json.load(open('.github/release.json'))
          run = request['run_id']
          assert isinstance(run, int) and run > 0
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write(f'run_id={run}\n')
          PY
      - name: Verify successful candidate workflow
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.candidate.outputs.run_id }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" > /tmp/candidate.json
          python3 - <<'PY'
          import json
          run = json.load(open('/tmp/candidate.json'))
          request = json.load(open('.github/release.json'))
          assert run['conclusion'] == 'success'
          assert run['path'] in ('.github/workflows/packages.yml', '.github/workflows/package-existing.yml',
                                 '.github/workflows/update-130.yml')
          assert run['head_sha'] == request['source_commit']
          PY
      - uses: actions/download-artifact@v4
        with:
          name: release-packages
          path: release-packages
          run-id: ${{ steps.candidate.outputs.run_id }}
          github-token: ${{ github.token }}
      - name: Verify source, names, lengths and SHA-256 hashes
        id: verify
        run: python3 tools/release_packages.py verify release-packages .github/release.json
      - name: Create draft, upload and publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.verify.outputs.version }}
          RELEASE_VERSION: ${{ steps.verify.outputs.release_version }}
        run: |
          set -euo pipefail
          RELEASE_ID=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq ".[] | select(.tag_name == \"v$RELEASE_VERSION\") | .id")
          if [ -n "$RELEASE_ID" ]; then
            gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" > /tmp/existing-release.json
            if [ "$(python3 -c 'import json; print(str(json.load(open("/tmp/existing-release.json"))["draft"]).lower())')" = false ]; then
              python3 tools/replace_release.py "$RELEASE_ID" release-packages
              exit 0
            fi
            python3 - <<'PY'
          import json, sys
          sys.path.insert(0, 'tools')
          from release_packages import verify_source
          release = json.load(open('/tmp/existing-release.json'))
          assert release['draft'], 'Existing release is already published'
          verify_source(release['target_commitish'])
          wanted = json.load(open('.github/release.json'))['assets']
          actual = {asset['name']: asset for asset in release['assets']}
          if set(actual) == set(wanted) and all(actual[name]['size'] == value['size'] and
                  actual[name]['digest'] == 'sha256:' + value['sha256'] for name, value in wanted.items()):
              open('/tmp/assets-already-verified', 'w').close()
          PY
          else
            python3 - <<'PYDRAFT'
          import json, os, sys
          from pathlib import Path
          sys.path.insert(0, 'tools')
          from release_packages import release_body
          version = os.environ['RELEASE_VERSION']
          request = json.load(open('.github/release.json'))
          json.dump({'tag_name': 'v' + version, 'target_commitish': os.environ['GITHUB_SHA'],
                     'name': 'ReLoq C ' + version, 'draft': True,
                     'body': release_body(Path(f'docs/releases/{version}.md').read_text(), request.get('build_epoch'))},
                    open('/tmp/draft-release.json', 'w'))
          PYDRAFT
            # Capture the created ID directly: release collections can lag a
            # newly created draft, and draft lookups by tag may return 404.
            RELEASE_ID=$(gh api --method POST "repos/$GITHUB_REPOSITORY/releases" --input /tmp/draft-release.json --jq .id)
          fi
          test -n "$RELEASE_ID"
          if [ ! -f /tmp/assets-already-verified ]; then
            gh release upload "v$RELEASE_VERSION" release-packages/*.exe release-packages/*.nvda-addon release-packages/*.apk --clobber
          fi
          gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" > /tmp/release-assets.json
          python3 - <<'PY'
          import json
          wanted = json.load(open('.github/release.json'))['assets']
          actual = {asset['name']: asset for asset in json.load(open('/tmp/release-assets.json'))['assets']}
          assert set(actual) == set(wanted)
          for name, metadata in wanted.items():
              assert actual[name]['size'] == metadata['size']
              assert actual[name]['digest'] == 'sha256:' + metadata['sha256']
          PY
          python3 - <<'PY'
          import json, os, sys
          from pathlib import Path
          sys.path.insert(0, 'tools')
          from release_packages import release_body
          request = json.load(open('.github/release.json'))
          notes = Path(f'docs/releases/{request["release_version"]}.md').read_text()
          json.dump({'draft': False, 'make_latest': 'true', 'target_commitish': os.environ['GITHUB_SHA'],
                     'body': release_body(notes, request.get('build_epoch'))},
                    open('/tmp/publish-release.json', 'w'))
          PY
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" --input /tmp/publish-release.json --jq .html_url
      - name: Withdraw the superseded test release after official publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          request = json.load(open('.github/release.json'))
          tag = request.get('supersedes_tag')
          if not tag:
              raise SystemExit(0)
          repo = os.environ['GITHUB_REPOSITORY']
          releases = json.loads(subprocess.check_output(['gh', 'api', f'repos/{repo}/releases?per_page=100']))
          current = next(release for release in releases if release['tag_name'] == 'v' + request['release_version'])
          assert not current['draft'] and len(current['assets']) == 3
          previous = next((release for release in releases if release['tag_name'] == tag), None)
          if previous and not previous['draft']:
              subprocess.run(['gh', 'api', '--method', 'PATCH', f"repos/{repo}/releases/{previous['id']}",
                              '--input', '-'], input=json.dumps({'draft': True}), text=True, check=True,
                              stdout=subprocess.DEVNULL)
              print(f'{tag} retained as an internal draft; official release is {current["tag_name"]}')
          PY
