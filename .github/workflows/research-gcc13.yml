name: Prepare local compiler for native tests
on:
  push:
    branches: ['codex/reloq-gcc13-bootstrap']
permissions:
  contents: read
jobs:
  compiler:
    runs-on: ubuntu-24.04
    steps:
      - name: Archive the installed compiler executables
        run: tar -C / -cf - usr/libexec/gcc/x86_64-linux-gnu/13 | gzip -1 > gcc13-libexec.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: gcc13-libexec
          path: gcc13-libexec.tar.gz
          compression-level: 0
          retention-days: 2
