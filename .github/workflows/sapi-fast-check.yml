name: Verify SAPI PCM and event parity
on:
  push:
    branches: [codex/sapi-diagnostic]
permissions:
  contents: read
  actions: write
jobs:
  cancel-superseded:
    runs-on: ubuntu-24.04
    steps:
      - name: Cancel the superseded candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run cancel 41886939702 --repo "$GITHUB_REPOSITORY" || true
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: host-native-library
          path: eci
          run-id: 41885284810
          github-token: ${{ github.token }}
      - name: Run SAPI host tests
        run: make -C sapi test
      - name: Compare against the previous SAPI adapter
        run: |
          git show 76e2c04bb00c66ece46a93224a1066d5dab57328:sapi/backend.c > /tmp/original-backend.c
          cc -std=c11 -O2 -Wall -Wextra -Werror -Wno-misleading-indentation -DRELOQ_SAPI_TEST_HOST -DRELOQ_SAPI_REFERENCE_BASELINE -I sapi -I include /tmp/original-backend.c sapi/test_host.c sapi/test_backend.c src/reloq_voice_controls.c -ldl -lpthread -lm -o /tmp/original-sapi-test
          /tmp/original-sapi-test "$PWD/eci/libreloq_eci.so" > /tmp/original-sapi.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          original=json.loads(Path('/tmp/original-sapi.json').read_text())
          candidate=json.loads(Path('sapi/build/backend-results.json').read_text())
          assert original['long_german']==candidate['long_german'], 'long German PCM or events changed'
          assert original['comparisons']==candidate['comparisons'], 'language/rate PCM or marks changed'
          print('Previous and candidate SAPI: all language/rate PCM, events and long German output match.')
          PY
  package-names:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: android-stable-identity
          path: candidate/android
          run-id: 41885284810
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: nvda-stable-identity
          path: candidate/nvda
          run-id: 41885284810
          github-token: ${{ github.token }}
      - name: Audit delivered package names and text
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re,zipfile
          apk,=Path('candidate/android').glob('*.apk')
          with zipfile.ZipFile(apk) as archive:
              assert archive.testzip() is None
              assert all(not re.search(r'experimental|preview',n,re.I) for n in archive.namelist())
              dex=archive.read('classes.dex')
              assert b'org/reloq/tts/preview' not in dex and b'org.reloq.tts.preview' not in dex
              assert b'Lorg/reloq/tts/ReLoqService;' in dex
          addon,=Path('candidate/nvda').glob('*.nvda-addon')
          with zipfile.ZipFile(addon) as archive:
              assert archive.testzip() is None
              manifest=archive.read('manifest.ini').decode('utf-8')
              assert 'name = "reloqC"' in manifest and 'version = "1.1.0"' in manifest
              for name in archive.namelist():
                  assert not re.search(r'experimental|preview',name,re.I),name
                  if name.endswith(('.py','.ini','.html')):
                      assert not re.search(rb'experimental|preview',archive.read(name),re.I),name
          print('Android and NVDA package names and authored text use stable names.')
          PY
