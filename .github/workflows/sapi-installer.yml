name: SAPI5 installer and Windows validation
on:
  push:
    branches: [main, codex/release110]
    paths:
      - .github/workflows/sapi-installer.yml
      - sapi/**
      - eci/**
      - src/**
      - include/**
      - vendor/**
      - data/community/**
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, x86]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install cross compiler
        timeout-minutes: 25
        run: |
          set -euo pipefail
          if [ '${{ matrix.arch }}' = x64 ]; then prefix=x86-64; compiler_prefix=x86_64; else prefix=i686; compiler_prefix=i686; fi
          if command -v "$compiler_prefix-w64-mingw32-gcc-posix" >/dev/null; then exit 0; fi
          # Azure's mirror can become too slow for the cross-toolchain; use
          # Ubuntu's official archive on these disposable build machines.
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|http://archive.ubuntu.com/ubuntu|g' /etc/apt/apt-mirrors.txt
          fi
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update -qq
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y --no-install-recommends gcc-mingw-w64-$prefix-posix
      - uses: actions/cache@v4
        id: rules
        with:
          path: vendor/openevv61/build
          key: sapi-rules-ubuntu24-gcc13-v1-${{ matrix.arch }}-${{ hashFiles('vendor/openevv61/**', 'include/**', 'src/reloq_voice_filter.c', 'src/reloq_orthography.c', 'src/reloq_german_word_edges.c', 'src/reloq_english_word_edges.c') }}
      - name: Restore unchanged rule timestamps
        if: steps.rules.outputs.cache-hit == 'true'
        run: find vendor/openevv61/build -type f -exec touch {} +
      - name: Build native core and SAPI adapter
        shell: bash
        run: |
          set -euo pipefail
          if [ '${{ matrix.arch }}' = x64 ]; then prefix=x86_64; else prefix=i686; fi
          make -C eci -j2 windows-${{ matrix.arch }} PROVIDER_LTO=-flto=2 WINDOWS_CC=$prefix-w64-mingw32-gcc-posix WINDOWS_OBJDUMP=$prefix-w64-mingw32-objdump
          python3 sapi/build.py --arch ${{ matrix.arch }} --cc $prefix-w64-mingw32-gcc-posix --objdump $prefix-w64-mingw32-objdump
      - uses: actions/upload-artifact@v4
        with:
          name: sapi-native-${{ matrix.arch }}
          path: dist/reloq-c-sapi5-${{ matrix.arch }}-*.zip
          compression-level: 0
          retention-days: 7
  installer:
    needs: native
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: sapi-native-*
          path: dist
          merge-multiple: true
      - name: Download and verify the alternative dictionary through both adapters
        shell: pwsh
        run: |
          foreach ($arch in @('x64', 'x86')) {
            $zip = (Get-ChildItem dist/reloq-c-sapi5-$arch-*.zip | Select-Object -First 1).FullName
            Expand-Archive -Path $zip -DestinationPath "test-$arch"
            & "./test-$arch/Test-Dictionary.exe"
            if ($LASTEXITCODE -ne 0) { throw "Dictionary source smoke test failed for $arch" }
          }
      - name: Compile unified Inno Setup installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) { throw 'Inno Setup 6 compiler not installed on runner' }
          python sapi/build_installer.py --iscc $iscc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install, upgrade, test SAPI in RAM, and uninstall
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/validation | Out-Null
          $setup = (Get-ChildItem dist/reloq-c-sapi5-*-setup.exe | Sort-Object LastWriteTime | Select-Object -Last 1).FullName
          $install = Join-Path $env:ProgramFiles 'ReLoq C\SAPI5'
          $group = Join-Path ([Environment]::GetFolderPath('CommonPrograms')) 'ReLoq C SAPI5'
          function Test-StartLinks($settingsName, $guideName) {
            $shell = New-Object -ComObject WScript.Shell
            $links = @(Get-ChildItem $group -Filter *.lnk)
            if ($links.Count -ne 3) { throw "Expected three Start menu entries, found $($links.Count)" }
            $expected = @{}
            $expected["ReLoq C - $settingsName.lnk"] = Join-Path $install 'ReLoqSettings.exe'
            $expected["ReLoq C - $guideName.lnk"] = Join-Path $install 'README.txt'
            foreach ($name in $expected.Keys) {
              $shortcut = $shell.CreateShortcut((Join-Path $group $name))
              if ($shortcut.TargetPath -ne $expected[$name] -or !(Test-Path $shortcut.TargetPath)) {
                throw "Incorrect Start menu link: $name -> $($shortcut.TargetPath)"
              }
            }
            $targets = @($links | ForEach-Object { $shell.CreateShortcut($_.FullName).TargetPath })
            if ((Join-Path $install 'unins000.exe') -notin $targets) { throw 'Uninstall shortcut missing' }
            $links.Name | Out-File -Append dist/validation/start-menu.txt
          }
          $p = Start-Process $setup -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-','/LANG=en',"/LOG=$pwd\dist\validation\install.log" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Install failed: $($p.ExitCode)" }
          Test-StartLinks 'Voice settings' 'User guide'
          $dictionary = Join-Path $install 'dictionaries\ENUmain.dic'
          [IO.File]::AppendAllText($dictionary, "`r`n", [Text.Encoding]::ASCII)
          $edited = (Get-FileHash $dictionary -Algorithm SHA256).Hash
          $p = Start-Process $setup -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-','/LANG=de',"/LOG=$pwd\dist\validation\upgrade.log" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Upgrade failed: $($p.ExitCode)" }
          Test-StartLinks 'Stimmeinstellungen' 'Anleitung'
          if ((Get-FileHash $dictionary -Algorithm SHA256).Hash -ne $edited) { throw 'Dictionary edit lost during upgrade' }
          & ./sapi/test_japanese_sapi.ps1 -ReportPath dist/validation/japanese-results.json
          foreach ($arch in @('x64','x86')) {
            $test = if ($arch -eq 'x64') { Join-Path $install 'Test-SAPI.exe' } else { Join-Path $install 'x86\Test-SAPI.exe' }
            & $test --all-native-rates *> "dist/validation/sapi-$arch.txt"
            $testExit = $LASTEXITCODE
            if ($testExit -ne 0) {
              Get-Content "dist/validation/sapi-$arch.txt" -Tail 60
              if ($arch -eq 'x86') {
                $env:RAL_TRACE = '1'
                & $test --first-case *> "dist/validation/sapi-x86-trace.txt"
                Remove-Item Env:RAL_TRACE
                Get-Content "dist/validation/sapi-x86-trace.txt" -Tail 120
              }
              throw "SAPI $arch validation failed with exit code $testExit"
            }
          }
          $p = Start-Process (Join-Path $install 'unins000.exe') -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',"/LOG=$pwd\dist\validation\uninstall.log" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Uninstall failed: $($p.ExitCode)" }
          if (Test-Path $group) { throw 'Start menu group remains after uninstall' }
          if (!(Test-Path $dictionary) -or (Get-FileHash $dictionary -Algorithm SHA256).Hash -ne $edited) { throw 'User dictionary lost during uninstall' }
          foreach ($view in @([Microsoft.Win32.RegistryView]::Registry32,[Microsoft.Win32.RegistryView]::Registry64)) {
            $h = [Microsoft.Win32.RegistryKey]::OpenBaseKey([Microsoft.Win32.RegistryHive]::LocalMachine,$view)
            $k = $h.OpenSubKey('SOFTWARE\Microsoft\Speech\Voices\Tokens')
            if ($k -and @($k.GetSubKeyNames() | Where-Object { $_ -like 'ReLoqC_*' }).Count) { throw "Voice tokens remain: $view" }
            if ($k) { $k.Dispose() }; $h.Dispose()
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sapi-installer
          path: |
            dist/reloq-c-sapi5-*-setup.exe
            dist/*installer*.json
            dist/validation/
          compression-level: 0
          retention-days: 14
