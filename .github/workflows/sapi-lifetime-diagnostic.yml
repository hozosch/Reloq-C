name: Temporary SAPI lifetime probe
on:
  push:
    branches: [codex/sapi-direct-probe-20261107]
permissions:
  contents: read
  actions: read
jobs:
  adapter:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: e425a9c99553605ccfd3538ac5f93fb3c2ad4783
      - name: Install cross compiler
        run: sudo apt-get update -qq && sudo apt-get install -y gcc-mingw-w64-x86-64
      - name: Build diagnostic adapters and thread test
        shell: bash
        run: |
          mkdir -p diagnostic
          cp sapi/backend.c /tmp/backend-original.c
          python3 - <<'PY'
          from pathlib import Path
          p=Path('sapi/backend.c')
          s=p.read_text()
          old='static void WINAPI cache_gone(void *value){cache_destroy(value);}'
          assert old in s
          p.write_text(s.replace(old,'static void WINAPI cache_gone(void *value){if(0)cache_destroy(value);}'))
          PY
          make -C sapi build/ReLoqSapi.dll ARCH=x64
          cp sapi/build/ReLoqSapi.dll diagnostic/no-cleanup.dll
          cp /tmp/backend-original.c sapi/backend.c
          python3 - <<'PY'
          from pathlib import Path
          p=Path('sapi/backend.c')
          s=p.read_text()
          old='static void WINAPI cache_gone(void *value){cache_destroy(value);}'
          new='''typedef BOOLEAN (WINAPI *shutdown_query)(void);
          static shutdown_query query_shutdown;
          static void WINAPI cache_gone(void *value){
              int closing=query_shutdown && query_shutdown();
              fprintf(stderr,"cache_gone closing=%d\\n",closing);fflush(stderr);
              if(!closing)cache_destroy(value);
              fprintf(stderr,"cache_gone done\\n");fflush(stderr);
          }'''
          assert old in s
          s=s.replace(old,new)
          old='cache_key=FlsAlloc(cache_gone);return cache_key!=FLS_OUT_OF_INDEXES;'
          new='''HMODULE ntdll=GetModuleHandleW(L"ntdll.dll");
              FARPROC p=ntdll?GetProcAddress(ntdll,"RtlDllShutdownInProgress"):NULL;
              if(p)memcpy(&query_shutdown,&p,sizeof p);
              cache_key=FlsAlloc(cache_gone);return cache_key!=FLS_OUT_OF_INDEXES;'''
          assert old in s
          p.write_text(s.replace(old,new))
          p=Path('sapi/test_windows.c')
          s=p.read_text().replace('int wmain(int argc,wchar_t **argv)','static int run_one(int argc,wchar_t **argv)')
          s+='''
          static DWORD WINAPI run_thread(void *ignored) {
              (void)ignored; wchar_t *args[] = {L"Test-SAPI", L"--first-case"};
              return run_one(2,args);
          }
          int wmain(int argc,wchar_t **argv) {
              if (argc != 2 || wcscmp(argv[1],L"--threadcase")) return run_one(argc,argv);
              for (int i=0;i<12;++i) {
                  HANDLE h=CreateThread(NULL,0,run_thread,NULL,0,NULL);
                  if(!h) return 2;
                  DWORD wait=WaitForSingleObject(h,15000),result=99;
                  GetExitCodeThread(h,&result); CloseHandle(h);
                  wprintf(L"Thread %d: wait=%lu result=%lu\\n",i,(unsigned long)wait,(unsigned long)result);
                  if(wait!=WAIT_OBJECT_0||result) return 3;
              }
              return 0;
          }
          '''
          p.write_text(s)
          PY
          make -C sapi build/ReLoqSapi.dll build/Test-SAPI.exe ARCH=x64
          cp sapi/build/ReLoqSapi.dll diagnostic/guarded.dll
          cp sapi/build/Test-SAPI.exe diagnostic/Test-SAPI.exe
      - uses: actions/upload-artifact@v4
        with:
          name: diagnostic-adapter
          path: diagnostic/*
  probe:
    runs-on: windows-latest
    timeout-minutes: 5
    needs: adapter
    steps:
      - uses: actions/download-artifact@v4
        with:
          run-id: 42363445606
          github-token: ${{ github.token }}
          name: sapi-native-x64
          path: payload
      - uses: actions/download-artifact@v4
        with:
          name: diagnostic-adapter
          path: diagnostic
      - name: Run isolated process and thread lifetime checks
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Expand-Archive (Get-ChildItem payload/*.zip | Select-Object -First 1).FullName -DestinationPath test
          Copy-Item diagnostic/Test-SAPI.exe test/Test-SAPI.exe -Force
          foreach ($mode in @('no-cleanup','guarded')) {
            Copy-Item "diagnostic/$mode.dll" test/ReLoqSapi.dll -Force
            $reg=Start-Process "$env:windir/System32/regsvr32.exe" -ArgumentList '/s', (Resolve-Path test/ReLoqSapi.dll).Path -Wait -PassThru
            if($reg.ExitCode -ne 0){throw 'registration failed'}
            foreach ($case in @('--first-case','--threadcase')) {
              $output="$mode-$($case.TrimStart('-'))-out.txt"; $err="$mode-$($case.TrimStart('-'))-err.txt"
              $p=Start-Process (Resolve-Path test/Test-SAPI.exe).Path -ArgumentList $case -RedirectStandardOutput $output -RedirectStandardError $err -PassThru
              $done=$p.WaitForExit(45000)
              Write-Host "Case $mode $case finished=$done PID=$($p.Id)"
              Get-Content $output,$err -ErrorAction SilentlyContinue | Write-Host
              if(!$done){Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue;throw "Timeout $mode $case"}
              if($p.ExitCode -ne 0){throw "Failure $mode $case exit=$($p.ExitCode)"}
            }
          }
