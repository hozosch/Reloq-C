name: Investigate SAPI first audio
on:
  push:
    branches: [codex/sapi-110-response]
concurrency:
  group: sapi-response-investigation
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  measure:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Build native host engine
        run: make -C eci -j2 all PROVIDER_LTO=-flto=2
      - name: Compare the original and new SAPI startup delivery
        run: |
          set -euo pipefail
          git show 76e2c04bb00c66ece46a93224a1066d5dab57328:sapi/backend.c > /tmp/reloq-sapi-before.c
          common=(-std=c11 -O2 -Wall -Wextra -Werror -Wno-misleading-indentation
                  -DRELOQ_SAPI_TEST_HOST -I sapi -I include)
          cc "${common[@]}" /tmp/reloq-sapi-before.c sapi/test_host.c sapi/measure_startup.c src/reloq_voice_controls.c -ldl -lpthread -lm -o /tmp/sapi-before
          cc "${common[@]}" sapi/backend.c sapi/test_host.c sapi/measure_startup.c src/reloq_voice_controls.c -ldl -lpthread -lm -o /tmp/sapi-after
          /tmp/sapi-before "$PWD/eci/libreloq_eci.so" > /tmp/sapi-before.txt
          /tmp/sapi-after "$PWD/eci/libreloq_eci.so" > /tmp/sapi-after.txt
          python3 - <<'PY'
          import re, statistics
          from pathlib import Path
          rx = re.compile(r"language=(\\w+) hz=(\\d+) events=(\\d) words=(\\d+) iteration=(\\d) first_ms=([\\d.]+) playable_ms=([\\d.]+) total_ms=([\\d.]+) samples=(\\d+)")
          def read(path):
              rows = []
              for line in Path(path).read_text().splitlines():
                  m = rx.fullmatch(line)
                  if not m: raise AssertionError(line)
                  lang,hz,event,words,iteration,first,playable,total,samples = m.groups()
                  rows.append((lang,int(hz),int(event),int(words),int(iteration),float(playable),int(samples)))
              assert len(rows) == 128
              return rows
          before, after = read('/tmp/sapi-before.txt'), read('/tmp/sapi-after.txt')
          for old,new in zip(before,after):
              assert old[:5] == new[:5]
              assert new[6] < (new[1]+19)//20+512
          for hz in (11025,48000):
              for language in ('en','de'):
                  old = [r for r in before if r[0] == language and r[1] == hz and r[2] == 0 and r[3] == 100 and r[4] > 0]
                  new = [r for r in after if r[0] == language and r[1] == hz and r[2] == 0 and r[3] == 100 and r[4] > 0]
                  assert min(r[6] for r in old) > max(r[6] for r in new)
                  print(f'{language} {hz} Hz: initial samples before {old[0][6]}, after {new[0][6]}; median 50-ms threshold before {statistics.median(r[5] for r in old):.2f} ms, after {statistics.median(r[5] for r in new):.2f} ms')
          PY
      - name: Verify SAPI transport, event positions and dictionaries
        run: make -C sapi test
