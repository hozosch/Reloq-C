name: Measure the Windows SAPI start path
on:
  push:
    branches: ['codex/sapi-latency-*']
permissions:
  contents: read
  actions: read
jobs:
  compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Windows cross compiler
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gcc-mingw-w64-x86-64-posix
      - name: Build the stream timing probe
        run: |
          x86_64-w64-mingw32-gcc-posix -std=c11 -O2 -Wall -Wextra -Werror -Wno-misleading-indentation -DUNICODE -D_UNICODE -I sapi sapi/test_windows_latency.c sapi/guids.c -static-libgcc -municode -lole32 -luuid -o sapi-latency.exe
          make -C sapi build/ReLoqSapi.dll CC=x86_64-w64-mingw32-gcc-posix
      - uses: actions/upload-artifact@v4
        with:
          name: sapi-latency-probe
          path: |
            sapi-latency.exe
            sapi/build/ReLoqSapi.dll
  windows:
    needs: compile
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: sapi-latency-probe
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 42211928699
          name: sapi-installer
          path: previous
      - name: Install the previous test build and measure the Windows stream
        shell: pwsh
        run: |
          $setup = (Get-Item previous/reloq-c-sapi5-1.1.4-dev1-setup.exe).FullName
          $p = Start-Process $setup -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Install failed: $($p.ExitCode)" }
          Write-Host 'Previous adapter, after voice selection'
          & ./sapi-latency.exe 500
          if ($LASTEXITCODE -ne 0) { throw 'Windows SAPI timing probe failed' }
          $install = Join-Path $env:ProgramFiles 'ReLoq C\SAPI5'
          Copy-Item (Join-Path $install 'ReLoqSapi.dll') original-adapter.dll
          Copy-Item sapi/build/ReLoqSapi.dll (Join-Path $install 'ReLoqSapi.dll') -Force
          Write-Host 'Prepared adapter, after voice selection'
          & ./sapi-latency.exe 500
          if ($LASTEXITCODE -ne 0) { throw 'Prepared Windows SAPI timing probe failed' }
          Write-Host 'Prepared adapter, immediately after voice selection'
          & ./sapi-latency.exe 0
          if ($LASTEXITCODE -ne 0) { throw 'Immediate Windows SAPI timing probe failed' }
          Copy-Item original-adapter.dll (Join-Path $install 'ReLoqSapi.dll') -Force
          Write-Host 'Previous adapter with files already cached'
          & ./sapi-latency.exe 500
          if ($LASTEXITCODE -ne 0) { throw 'Repeated Windows SAPI timing probe failed' }
