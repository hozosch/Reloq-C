name: Temporary SAPI host tracing
on:
  push:
    branches: [codex/sapi-latency-dev5-20261107]
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends gcc-mingw-w64-i686-posix
      - run: i686-w64-mingw32-gcc -std=c11 -Os -Wall -Wextra -Werror -Wno-misleading-indentation -municode -DUNICODE -D_UNICODE -I sapi -I include sapi/test_latency_windows.c sapi/guids.c -static-libgcc -lole32 -luuid -ladvapi32 -lcomctl32 -lshell32 -lgdi32 -lwinhttp -lm -o latency.exe
      - run: make -C sapi ARCH=x86 build/x86/ReLoqSapi.dll
      - run: mkdir diagnostic && cp latency.exe sapi/build/x86/ReLoqSapi.dll diagnostic/
      - uses: actions/upload-artifact@v4
        with:
          name: trace-probe
          path: diagnostic/*
  trace:
    runs-on: windows-latest
    timeout-minutes: 8
    needs: build
    steps:
      - uses: actions/download-artifact@v4
        with:
          run-id: 42381540459
          github-token: ${{ github.token }}
          name: sapi-native-x86
          path: candidate-archive
      - uses: actions/download-artifact@v4
        with:
          name: trace-probe
          path: diagnostic
      - name: Trace actual SAPI callback and context lifetime
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Expand-Archive (Get-ChildItem candidate-archive/*.zip | Select-Object -First 1).FullName -DestinationPath candidate
          Copy-Item diagnostic/ReLoqSapi.dll candidate/ReLoqSapi.dll -Force
          $reg=Start-Process "$env:windir/SysWOW64/regsvr32.exe" -ArgumentList '/s', (Resolve-Path 'candidate/ReLoqSapi.dll').Path -Wait -PassThru
          if($reg.ExitCode -ne 0){throw 'candidate registration failed'}
          New-Item -Path 'HKCU:\Software\ReLoq C\SAPI5' -Force | Out-Null
          New-ItemProperty -Path 'HKCU:\Software\ReLoq C\SAPI5' -Name OutputRate -PropertyType DWord -Value 2 -Force | Out-Null
          $env:RELOQ_SAPI_TRACE='1'
          $token='HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Speech\Voices\Tokens\ReLoqC_01_00040000'
          & ./diagnostic/latency.exe $token
          if($LASTEXITCODE -ne 0){throw "trace failed: $LASTEXITCODE"}
