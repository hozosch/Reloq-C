name: Diagnose the Windows candidate
on:
  push:
    branches: [codex/wordseg-native-probe-20261111]
permissions:
  contents: read
  actions: read
jobs:
  probe:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 84cfa61081657aa76a619458a258718d6b2a270a
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: wordseg-windows-candidate
          run-id: 43038970204
          github-token: ${{ github.token }}
          path: candidate
      - name: Run diagnostic checks
        shell: pwsh
        run: |
          $dll = (Get-ChildItem candidate -Recurse -Filter eci.dll | Select-Object -First 1).FullName
          $addon = (Get-ChildItem candidate -Recurse -Filter *.nvda-addon | Select-Object -First 1).FullName
          python nvda/test_eci_wordseg_native.py --library $dll
          Write-Output "wordseg exit: $LASTEXITCODE"
          python nvda/test_eci_german_cup_native.py --library $dll
          Write-Output "german cup exit: $LASTEXITCODE"
          python addon/test_synth_native.py --library $dll --addon $addon
          Write-Output "adapter exit: $LASTEXITCODE"
          exit 0
