name: Verify updated compound candidate
on:
  push:
    branches: [codex/wordseg-native-probe-20261111]
permissions:
  contents: read
  actions: read
jobs:
  probe:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 0d44aa40810c39b10dcc51301c9114bcf20219d6
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: wordseg-windows-candidate
          run-id: 43040470994
          github-token: ${{ github.token }}
          path: candidate
      - name: Test both English dialects and personal dictionaries
        shell: pwsh
        run: |
          $dll = (Get-ChildItem candidate -Recurse -Filter eci.dll | Select-Object -First 1).FullName
          python nvda/test_eci_wordseg_native.py --library $dll
          if ($LASTEXITCODE -ne 0) { throw 'Word segmentation failed' }
