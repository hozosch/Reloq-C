name: Compare fileswap across English dialects
on:
  push:
    branches: [codex/wordseg-native-probe-20261111]
permissions:
  contents: read
  actions: read
jobs:
  probe:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 0d44aa40810c39b10dcc51301c9114bcf20219d6
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: wordseg-windows-candidate
          run-id: 43041033700
          github-token: ${{ github.token }}
          path: candidate
      - name: Probe actual ECI phonemes and audio
        shell: bash
        run: |
          dll=$(find candidate -name eci.dll -print -quit)
          python - "$dll" <<'PY'
          import hashlib, re, sys
          from pathlib import Path
          sys.path.insert(0, 'nvda')
          from _reloq_eci_direct import DirectEciEngine, WORD_SEGMENTATION
          from test_eci_german_clock_native import render
          pairs={'fileswap':('file','swap'), 'swapfile':('swap','file'), 'filebuffer':('file','buffer'), 'bufferfile':('buffer','file'), 'framebuffer':('frame','buffer'), 'screenreader':('screen','reader'), 'redhead':('red','head')}
          def phones(s):
              return ''.join(re.sub(r'\.[0-3]', '', p) for p in re.findall(r'`\[([^]]+)\]', s))
          for dialect in (0x10000, 0x10001):
              engine=DirectEciEngine(Path(sys.argv[1]).resolve(), dialect=dialect, encoding='utf8', native_voice=True)
              try:
                  print('DIALECT',hex(dialect))
                  for word,parts in pairs.items():
                      engine.set_parameter(WORD_SEGMENTATION,0)
                      before=engine._phonemes_for_probe(word)
                      p=[engine._phonemes_for_probe(x) for x in parts]
                      engine.set_parameter(WORD_SEGMENTATION,1)
                      after=engine._phonemes_for_probe(word)
                      print(word,'before=',repr(before),'after=',repr(after),'parts=',repr(p),'matched=',phones(after)==''.join(phones(x) for x in p))
                  for text in ('fileswap', 'fileswap Fenster', 'Open fileswap now', 'Fileswap', 'FILESWAP'):
                      for state in (0,1):
                          engine.set_parameter(WORD_SEGMENTATION,state)
                          print('TEXT',repr(text),'setting',state,'PHONES',repr(engine._phonemes_for_probe(text)))
              finally:
                  engine.close()
          PY
