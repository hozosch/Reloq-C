name: Diagnose personal dictionary precedence
on:
  push:
    branches: [codex/wordseg-native-probe-20261111]
permissions:
  contents: read
  actions: read
jobs:
  probe:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 84cfa61081657aa76a619458a258718d6b2a270a
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: wordseg-windows-candidate
          run-id: 43038970204
          github-token: ${{ github.token }}
          path: candidate
      - name: Print dictionary readings
        shell: bash
        run: |
          dll=$(find candidate -name eci.dll -print -quit)
          python - "$dll" <<'PY'
          import sys, tempfile
          from pathlib import Path
          sys.path.insert(0, 'nvda')
          from _reloq_eci_direct import DirectEciEngine, WORD_SEGMENTATION
          for dialect, prefix in ((0x10000, 'ENU'), (0x10001, 'ENG')):
              engine=DirectEciEngine(Path(sys.argv[1]).resolve(), dialect=dialect, encoding='utf8', native_voice=True)
              try:
                  with tempfile.TemporaryDirectory() as temporary:
                      folder=Path(temporary)
                      (folder / (prefix+'main.dic')).write_bytes(b'framebuffer\t`[.1tEst]\nredhead\t`[.1zibrx]\n')
                      engine.set_dictionary_path(folder)
                      print('DIALECT',hex(dialect))
                      for state in (1, 0, 1, 0):
                          engine.set_parameter(WORD_SEGMENTATION, state)
                          for word in ('framebuffer', 'redhead'):
                              print(state, word, repr(engine._phonemes_for_probe(word)))
              finally:
                  engine.close()
          PY
