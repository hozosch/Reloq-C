name: Probe British compound phoneme input
on:
  push:
    branches: [codex/wordseg-native-probe-20261111]
permissions:
  contents: read
  actions: read
jobs:
  probe:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 0d44aa40810c39b10dcc51301c9114bcf20219d6
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: wordseg-windows-candidate
          run-id: 43041033700
          github-token: ${{ github.token }}
          path: candidate
      - name: Probe British phoneme tags
        shell: bash
        run: |
          dll=$(find candidate -name eci.dll -print -quit)
          python - "$dll" <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0,'nvda')
          from _reloq_eci_direct import DirectEciEngine, PROCESS_TAGS, WORD_SEGMENTATION
          from test_eci_german_clock_native import render
          engine=DirectEciEngine(Path(sys.argv[1]).resolve(), dialect=0x10001, encoding='utf8', native_voice=True)
          try:
              engine.set_parameter(PROCESS_TAGS,1)
              for text in ('swap', 'candle', 'fileswap', 'candlefile', 'filecandle', '`[.1fYl.2sw@p]', '`[.1kAn.0dL.2fYl]', '`[.1fYl.2kAn.0dL]'):
                  engine.set_parameter(WORD_SEGMENTATION, 0)
                  try:
                      print('PHONES',repr(text),repr(engine._phonemes_for_probe(text)))
                      a=render(engine,[text])[0]
                      print('AUDIO',repr(text),'size=',len(a))
                  except Exception as e:
                      print('ERROR',repr(text),repr(e))
          finally:
              engine.close()
          PY
