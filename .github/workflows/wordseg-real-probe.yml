name: Reproduce word boundaries in real NVDA
on:
  push:
    branches: ['codex/wordseg-real-probe']
permissions:
  contents: read
  actions: read
jobs:
  real-nvda:
    runs-on: windows-2022
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: nvda-addon
          path: candidate
          run-id: 43006678992
          github-token: ${{ github.token }}
      - name: Install real portable NVDA
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download release-2026.3.1 --repo nvaccess/nvda --pattern nvda_2026.3.1.exe --dir candidate
          if ($LASTEXITCODE -ne 0) { throw 'NVDA download failed' }
          if ((Get-FileHash candidate/nvda_2026.3.1.exe -Algorithm SHA256).Hash -ne '6F80A5B0CA720A7D0D314B5BE212F37388BBE81A1107AC3298C1821A1CD3F052') { throw 'Unexpected NVDA installer' }
          $portable = Join-Path $pwd 'portable-nvda'
          $installer = (Get-Item candidate/nvda_2026.3.1.exe).FullName
          $p = Start-Process $installer -ArgumentList '--create-portable-silent', "--portable-path=$portable" -Wait -PassThru
          if ($p.ExitCode -ne 0 -or !(Test-Path "$portable/nvda.exe")) { throw 'NVDA portable install failed' }
      - name: Verify candidate in real NVDA
        shell: pwsh
        run: |
          python -B addon/test_nvda_real_segmentation.py --nvda portable-nvda/nvda.exe --addon candidate/reloq-c-synth-x64-1.3.1.nvda-addon --driver addon/synth/synthDrivers/reloqC/__init__.py --work segmentation-probe
          if ($LASTEXITCODE -ne 0) { throw 'Real NVDA diagnosis failed' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wordseg-real-probe
          path: |
            segmentation-probe/result.json
            segmentation-probe/nvda.log
