name: Build and verify English compounds on Windows
on:
  push:
    branches: [codex/wordseg-win-fallback-20261111]
permissions:
  contents: read
  actions: read
jobs:
  reference-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify generated data and native segmentation
        run: |
          curl --fail --location --retry 3 --output /tmp/cmudict.dict https://raw.githubusercontent.com/cmusphinx/cmudict/74790861f652b15e4ac49015a90074ad62a27690/cmudict.dict
          python3 tools/generate_wordseg_compounds.py /tmp/cmudict.dict
          git diff --exit-code -- src/reloq_wordseg_compounds.inc
          cc -std=c11 -O2 -Wall -Wextra -Werror -pedantic -Iinclude tests/test_wordseg_native.c src/reloq_wordseg.c -o /tmp/test-wordseg
          /tmp/test-wordseg
  windows-core:
    runs-on: windows-2022
    timeout-minutes: 75
    env:
      RELOQ_BUILD_EPOCH: '1700000000'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Reuse the running provider build when available
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $deadline = (Get-Date).AddMinutes(12)
          do {
            $run = gh api "repos/${{ github.repository }}/actions/runs/43040470994/jobs" | ConvertFrom-Json
            $job = $run.jobs | Where-Object name -eq 'windows-core' | Select-Object -First 1
            $save = $job.steps | Where-Object name -like '*cache/save*' | Select-Object -First 1
            if ($save.conclusion -eq 'success' -or $job.status -eq 'completed') { break }
            Start-Sleep -Seconds 15
          } while ((Get-Date) -lt $deadline)
      - uses: actions/cache/restore@v4
        id: rules
        with:
          path: vendor/openevv61/build/windows-release
          key: wordseg-windows-gcc14-provider-v1-${{ hashFiles('vendor/openevv61/**', 'include/reloq_voice_filter.h', 'include/reloq_voice_controls.h', 'src/reloq_voice_filter.c', 'src/reloq_orthography.c', 'src/reloq_german_word_edges.c', 'src/reloq_english_word_edges.c') }}
      - name: Restore cached provider timestamps
        if: steps.rules.outputs.cache-hit == 'true'
        shell: bash
        run: find vendor/openevv61/build/windows-release -type f -exec touch {} +
      - name: Build the common ECI core
        shell: bash
        run: |
          export PATH="/c/mingw64/bin:/c/msys64/usr/bin:$PATH"
          command -v gcc
          command -v make
          command -v objdump
          make -C eci -j2 eci.dll SHELL=C:/msys64/usr/bin/bash.exe PROVIDER_LTO=-flto=2 WINDOWS_CC=gcc WINDOWS_OBJDUMP=objdump
          python eci/verify_pe_exports.py eci/eci.dll --objdump objdump --header include/reloq_eci.h
      - uses: actions/cache/save@v4
        if: steps.rules.outputs.cache-hit != 'true'
        with:
          path: vendor/openevv61/build/windows-release
          key: ${{ steps.rules.outputs.cache-primary-key }}
      - uses: actions/download-artifact@v4
        with:
          name: dictionary-snapshot
          run-id: 43029669789
          github-token: ${{ github.token }}
          path: data/community
      - name: Build the NVDA test package
        shell: bash
        run: |
          export PATH="/c/mingw64/bin:/c/msys64/usr/bin:$PATH"
          command -v msgfmt
          python - <<'PY'
          from pathlib import Path
          import sys
          p = Path('addon/synth/manifest.ini')
          manifest = p.read_text(encoding='utf8')
          assert 'version = "1.3.2"' in manifest
          p.write_text(manifest.replace('version = "1.3.2"', 'version = "1.3.2-dev4"'), encoding='utf8')
          sys.path.insert(0, 'addon')
          from build_synth import build
          build(Path('dist/reloq-c-synth-x64-1.3.2-dev4.nvda-addon'), Path('eci/eci.dll'), refresh_dictionaries=False)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: wordseg-windows-candidate
          path: |
            eci/eci.dll
            dist/reloq-c-synth-x64-1.3.2-dev4.nvda-addon
          compression-level: 0
          retention-days: 7
      - name: Verify the common core and package
        shell: pwsh
        run: |
          python nvda/test_eci_wordseg_native.py --library eci/eci.dll
          if ($LASTEXITCODE -ne 0) { throw 'Native word segmentation failed' }
          python nvda/test_eci_german_cup_native.py --library eci/eci.dll
          if ($LASTEXITCODE -ne 0) { throw 'German cup pronunciation failed' }
          python addon/test_synth_native.py --library eci/eci.dll --addon dist/reloq-c-synth-x64-1.3.2-dev4.nvda-addon
          if ($LASTEXITCODE -ne 0) { throw 'NVDA adapter failed' }
  actual-nvda:
    needs: [windows-core, reference-check]
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: wordseg-windows-candidate
          path: candidate
      - name: Install real portable NVDA
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download release-2026.3.1 --repo nvaccess/nvda --pattern nvda_2026.3.1.exe --dir candidate
          if ($LASTEXITCODE -ne 0) { throw 'NVDA download failed' }
          if ((Get-FileHash candidate/nvda_2026.3.1.exe -Algorithm SHA256).Hash -ne '6F80A5B0CA720A7D0D314B5BE212F37388BBE81A1107AC3298C1821A1CD3F052') { throw 'Unexpected NVDA installer' }
          $portable = Join-Path $pwd 'portable-nvda'
          $installer = (Get-Item candidate/nvda_2026.3.1.exe).FullName
          $p = Start-Process $installer -ArgumentList '--create-portable-silent', "--portable-path=$portable" -Wait -PassThru
          if ($p.ExitCode -ne 0 -or !(Test-Path "$portable/nvda.exe")) { throw 'NVDA portable install failed' }
      - name: Verify object announcements and dictionaries in real NVDA
        shell: pwsh
        run: |
          $addon = (Get-ChildItem candidate -Recurse -Filter *.nvda-addon | Select-Object -First 1).FullName
          python -B addon/test_nvda_real_segmentation.py --nvda portable-nvda/nvda.exe --addon $addon --work segmentation-probe
          if ($LASTEXITCODE -ne 0) { throw 'Real NVDA segmentation failed' }
          python -B addon/test_nvda_real_settings.py --nvda portable-nvda/nvda.exe --addon $addon --work settings-probe
          if ($LASTEXITCODE -ne 0) { throw 'NVDA dictionary controls failed' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wordseg-windows-nvda-results
          path: |
            segmentation-probe/result.json
            segmentation-probe/nvda.log
            settings-probe/result.json
            settings-probe/nvda.log
