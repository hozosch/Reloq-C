# ReLoq C Speech Dispatcher module settings.
#
# Speech Dispatcher sends language, voice, rate, pitch, pitch range, volume,
# punctuation, spelling and capital-letter settings with every message; they
# are not set here. Each voice is named "<Preset> (<Language>)", for example
# "Shelly (German)". Changes here take effect when Speech Dispatcher restarts
# the module, for example after: killall speech-dispatcher
#
# An invalid line is reported in Speech Dispatcher's log and ignored.

# Output sample rate in hertz: 8000, 11025, 16000, 22050, 32000, 44100 or
# 48000. 11025 is the classic Eloquence sound.
SampleRate 11025

# Shorten pauses: 0 never, 1 at the end of an utterance only, 2 always.
PauseMode 0

# Abbreviation dictionary (1 on, 0 off).
AbbreviationDictionary 1

# Phrase prediction (1 on, 0 off).
PhrasePrediction 0

# Original Eloquence question intonation for German and American English
# (1), or ReLoq's consistently rising questions (0).
OriginalQuestions 0

# Mellow mode, at 16000 Hz and above (1 on, 0 off).
MellowMode 0

# Acoustic timing: auto uses the original 5 ms clock for Castilian Spanish,
# Greek and Aragonese and 1 ms otherwise; 1 or 5 applies to every language.
AcousticTiming auto

# Split unfamiliar English words and camel case (1 on, 0 off).
WordSegmentation 0
CamelCase 0

# How far a single capital letter is raised in pitch when the client asks
# for capitals to be spelled (cap_let_recogn spell), 0 to 100.
CapitalPitchChange 20

# Optional pronunciation dictionaries: a directory holding ENUmain.dic,
# ENURoot.dic, ENUabbr.dic, DEUmain.dic, DEURoot.dic and DEUabbr.dic.
# The Linux package installs the community dictionaries in
# share/reloq-c/dictionaries under its prefix.
#DictionaryDirectory /usr/local/share/reloq-c/dictionaries

# Write debugging messages to Speech Dispatcher's log (1 on, 0 off).
Debug 0
